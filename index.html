<style>
:root{--paper:#F8F7F1;--sage-bg:#E9EDE5;--deep:#33483A;--accent:#59725E;--ink:#334036;--muted:#728073;--line:#D9E0D5;--chip:#FCFDF9;--white:#FFFFFF;--rounded:14px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid #85A98A;outline-offset:3px}button{cursor:pointer}a{color:var(--accent)}
.page{max-width:1160px;padding:0 35px;margin:auto}.site-head{padding:66px 0 39px;border-bottom:1px solid var(--line)}.overline{display:flex;align-items:center;gap:14px;font-size:11px;font-weight:720;letter-spacing:2px;color:var(--accent)}.overline:before{content:"";height:1px;width:28px;background:var(--accent)}h1{font-family:Georgia,'Times New Roman',serif;font-weight:500;font-size:clamp(36px,5.4vw,64px);letter-spacing:-2.2px;line-height:1.1;color:var(--deep);margin:18px 0 12px}.demo-tag{display:inline-flex;align-items:center;gap:8px;background:#EAF0E8;color:#456049;border:1px solid #D5E0D2;font-size:11px;border-radius:50px;padding:7px 11px;margin-top:19px;font-weight:650}.demo-tag::before{content:"";height:6px;width:6px;border-radius:50%;background:#719779}
.explore{padding:35px 0 32px;border-bottom:1px solid var(--line)}.explore-heading{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:22px}.section-eyebrow{font-size:11px;letter-spacing:1.8px;color:var(--accent);font-weight:750;margin:0 0 10px}.explore h2{font-size:23px;color:var(--deep);margin:0 0 9px;font-weight:650;letter-spacing:0.5px}.helper{font-size:13px;color:var(--muted);margin:0;line-height:1.8}.filter-row{display:grid;grid-template-columns:82px 1fr;gap:20px;align-items:start;margin:18px 0}.filter-label{font-weight:650;color:#647966;font-size:12px;padding-top:8px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--chip);color:var(--accent);border:1px solid #D2DCCF;border-radius:100px;font-size:12px;padding:8px 13px;line-height:1.15;transition:background .14s,color .14s,transform .14s}.chip:hover{background:#EDF3EA}.chip[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}.chip[aria-pressed="true"]:before{content:'✓ ';font-weight:700}.chip:active{transform:scale(.98)}
.tool-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:25px 0 0;padding:19px 0 0;border-top:1px solid var(--line)}.mode{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.mode-label{font-size:12px;color:var(--muted);font-weight:650}.segment{display:inline-flex;align-items:center;background:#E9EDE6;padding:4px;border-radius:10px}.segment button{border:0;background:transparent;color:#607361;border-radius:8px;padding:8px 12px;font-size:12px}.segment button[aria-pressed="true"]{background:#fff;color:var(--deep);box-shadow:0 1px 3px #2636241A;font-weight:700}.clear{border:0;background:transparent;color:var(--accent);font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:8px 2px}.clear:hover{color:var(--deep)}
.results-bar{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:31px 0 9px}.results-title{font-size:13px;color:var(--muted);margin:0}.results-title strong{color:var(--deep);font-size:18px;padding:0 3px}.watch-filter{display:flex;align-items:center;gap:10px;border:1px solid #C9D6C9;border-radius:100px;color:var(--deep);padding:10px 14px;background:transparent;font-size:12px;white-space:nowrap}.watch-filter[aria-pressed="true"]{background:var(--deep);color:#fff;border-color:var(--deep)}.watch-filter .count{display:inline-grid;place-items:center;border-radius:50%;width:19px;height:19px;background:#DDE6DA;color:#425B45;font-size:11px;font-weight:800}.watch-filter[aria-pressed="true"] .count{background:#F4F6F2}.watch-filter svg{width:15px;height:15px}
.series{display:grid;grid-template-columns:170px minmax(0,1fr);gap:28px;padding:39px 0 42px;border-bottom:1px solid var(--line)}.series:last-child{border-bottom:none}.poster{width:170px;height:250px;border-radius:7px;position:relative;overflow:hidden;background:linear-gradient(150deg,#CBD6CB 0%,#7E9282 58%,#3C5848 100%);box-shadow:0 5px 16px #4A61451C}.poster img{height:100%;width:100%;display:block;object-fit:cover;object-position:center top;position:absolute;inset:0}.poster-fallback{color:#FAF9F3;text-align:center;padding:30px 12px;display:grid;place-items:center;height:100%;font-family:Georgia,serif;font-size:20px;line-height:1.3;font-weight:600;letter-spacing:-.3px}.poster-fallback::before{content:'✦';font-size:32px;opacity:.6;position:absolute;top:16px;left:16px}.series-body{min-width:0}.series-top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.series h3{font-size:clamp(22px,2.4vw,28px);font-weight:670;letter-spacing:.2px;margin:0 0 5px;line-height:1.35;color:var(--deep)}.english{font-family:Georgia,'Times New Roman',serif;font-size:16px;color:#748676;margin:0 0 18px}.save{display:flex;align-items:center;gap:7px;flex:none;padding:9px 13px;background:transparent;border-radius:9px;border:1px solid #BCCBBF;color:var(--accent);font-size:12px;white-space:nowrap;transition:background .1s}.save:hover{background:#EEF3EB}.save[aria-pressed="true"]{background:#E5EEE3;border-color:#9EB79F;color:#36573E}.save svg{width:15px;height:15px}.facts{display:flex;flex-wrap:wrap;gap:0;align-items:center;margin-bottom:12px}.facts span{display:inline-flex;align-items:center;color:#5E705F;font-size:12px;font-weight:600;line-height:1.7}.facts span+span:before{content:'·';display:inline-block;margin:0 10px;color:#91A393}.tags{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 22px}.mini-tag{background:#EBF0E9;color:#536D57;font-size:11px;border-radius:5px;padding:5px 8px;line-height:1.3}.synopsis{font-size:14px;letter-spacing:.18px;line-height:1.93;color:#424F44;margin:0;text-align:left;overflow-wrap:anywhere}.empty{margin:42px 0 70px;padding:55px 25px;background:#EFF2EA;border-radius:var(--rounded);text-align:center;color:#536955}.empty h3{margin:0 0 8px;font-size:19px}.empty p{margin:0 0 18px;font-size:13px}.empty button{border:1px solid #AFC3AD;color:#466849;background:#fff;padding:9px 16px;border-radius:8px}
footer{padding:36px 0 60px;border-top:1px solid var(--line);font-size:11px;color:#859185;line-height:1.9}footer p{margin:4px 0}.source-link{color:#6E806D;text-decoration:underline;text-underline-offset:3px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:800px){.page{padding:0 24px}.site-head{padding:52px 0 31px}.filter-row{grid-template-columns:1fr;gap:8px}.filter-label{padding-top:0}.series{grid-template-columns:134px minmax(0,1fr);gap:20px}.poster{width:134px;height:198px}.series-top{flex-direction:column;gap:12px}.english{margin-bottom:10px}.series h3{font-size:23px}.save{padding:8px 11px}.tags{margin-bottom:14px}}
@media(max-width:600px){.page{padding:0 18px}.site-head{padding:44px 0 27px}.overline{font-size:10px}h1{font-size:38px;letter-spacing:-1.6px}.explore{padding:27px 0}.explore h2{font-size:21px}.chips{gap:7px}.chip{font-size:12px;padding:9px 12px}.tool-row{margin-top:18px}.results-bar{padding-top:24px}.series{grid-template-columns:104px minmax(0,1fr);column-gap:17px;row-gap:16px;padding:31px 0}.poster{width:104px;height:156px}.series h3{font-size:21px}.english{font-size:14px;line-height:1.3;margin:0 0 10px}.series-top{gap:9px}.save{font-size:11px;padding:7px 9px}.facts{gap:0;margin:4px 0 8px}.facts span{font-size:11px}.facts span+span:before{margin:0 6px}.tags{gap:5px}.mini-tag{font-size:10px;padding:5px 7px}.synopsis{grid-column:1/-1;font-size:13px;line-height:1.9}.series-body{display:contents}.series-head{grid-column:2}.series .synopsis{grid-column:1/-1}.series .title-and-meta{grid-column:2}.series article{min-width:0}.series .series-top{align-items:start}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.chip{transition:none}}
</style>
</head>
<body>
<div class="page">
 <header class="site-head">
  <div class="overline">A COLLECTION OF TIMELESS STORIES</div>
  <h1>TV SERIES LIBRARY</h1>
  
 </header>
 <main>
  <section class="explore" aria-labelledby="explore-title">
   <div class="explore-heading"><div><p class="section-eyebrow">DISCOVER BY GENRE &amp; TAGS</p><h2 id="explore-title">探索感興趣的故事</h2><p class="helper">類型單選；主題與特色可複選，並可選擇「全部符合」或「符合任一」。</p></div></div>
   <div class="filter-row"><div class="filter-label">GENRE｜類型</div><div class="chips" id="genre-chips" role="group" aria-label="影集主要類型篩選（單選）"></div></div>
   <div class="filter-row"><div class="filter-label">TAGS｜主題與特色</div><div class="chips" id="tag-chips" role="group" aria-label="主題與特色篩選（複選）"></div></div>
   <div class="tool-row"><div class="mode"><span class="mode-label">TAGS 符合方式</span><div class="segment" role="group" aria-label="篩選邏輯"><button type="button" data-mode="and" aria-pressed="true">全部符合 AND</button><button type="button" data-mode="or" aria-pressed="false">符合任一 OR</button></div></div><button class="clear" type="button" id="reset">清除篩選條件</button></div>
  </section>
  <div class="results-bar"><p class="results-title" id="result-count" aria-live="polite">顯示 <strong>25</strong> 部影集</p><button class="watch-filter" type="button" id="watch-filter" aria-pressed="false" aria-label="只顯示我的待看清單"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 4.6A1.6 1.6 0 0 1 7.6 3h8.8A1.6 1.6 0 0 1 18 4.6V21l-6-4-6 4V4.6Z"/></svg>只看待看 <span class="count" id="saved-count">0</span></button></div>
  <div class="series-list" id="series-list" aria-live="polite"></div>
 </main>
 <footer><p>收錄 25 部經典美國真人影集，依類型與主題特色探索。</p><p>海報圖片由外部來源提供，需連線使用；版權屬原權利人。待看清單保存在此瀏覽器，不會跨裝置同步。</p><p id="poster-credits"></p></footer>
</div>
<script>
'use strict';
const genres=["犯罪偵查","法律","醫療","救援","情境喜劇","家庭劇","人物關係劇"];
const tags=["家庭","友情","愛情","警察辦案","軍事","社會議題","醫療","鑑識","犯罪心理","諜報","黑色幽默","動作","懸疑"];
const shows=[{"id":"law-and-order-special-victims-unit","name":"法律與秩序：特殊受害者","english":"Law & Order: Special Victims Unit","years":"1999–至今","seasons":"28 季","episodes":"596 集","genre":["犯罪偵查"],"tags":["警察辦案","社會議題"],"synopsis":"故事以紐約市警察局特殊受害者組為中心，調查性侵、家庭暴力、虐童及涉及弱勢者的嚴重犯罪。Olivia Benson 從第一線警探逐漸成長為團隊領導者，與同事在案發現場、訊問室及法庭之間尋找證據。不同案件常反映社會真實爭議，受害者未必願意作證，證人也可能因恐懼、權力或親密關係而保持沉默。警探不只需要確認犯人，更要理解創傷如何影響證詞及人際信任。劇情也描寫調查者面對輿論、制度限制與個人情感時，如何在保護當事人和堅守程序正義之間做出選擇。Benson 對受害者的同理心是敘事重點，但她也必須提防情感介入影響判斷。隨著同事升遷、離職與新成員加入，組內辦案方式持續改變；劇集因此兼具單元案件和長期角色成長，也呈現社會如何重新理解性犯罪與權力不對等。辦案人員常必須向家屬解釋為何司法結果無法立即到來。","poster":"https://images.justwatch.com/poster/335509310/s718/law-and-order-special-victims-unit.jpg","posterSource":"https://www.justwatch.com/us/tv-show/law-and-order-special-victims-unit"},{"id":"law-order","name":"法律與秩序","english":"Law & Order","years":"1990–2010；2022–至今","seasons":"26 季","episodes":"546 集","genre":["法律"],"tags":["社會議題"],"synopsis":"本劇以紐約市形形色色的刑事案件為出發點，前半段跟隨警探走訪現場、尋找目擊者、追查嫌疑人，後半段則由地方檢察官整理證據、準備起訴並在法庭上交鋒。同一事件在警方與檢方眼中可能呈現不同面貌，證據是否能合法使用，也會直接左右審判結果。故事常借鑑社會新聞，討論階級、宗教、種族、金錢與公職權力造成的衝突。角色並非總能找到毫無爭議的答案，有時必須在法律文字、證人利益與公眾期待之間選擇代價較小的道路，呈現刑事司法制度的複雜性。劇集不提供簡單的善惡二分：掌握真相的人不一定能獲得有罪判決，警方認定的嫌疑人也可能因程序問題獲釋。正因每個環節都會改變案件方向，觀眾能看見從逮捕到起訴之間的分工，以及司法改革與現實限制的拉鋸。檢察官有時必須放棄情感上令人信服、法律上卻無法成立的主張。","poster":"","posterSource":""},{"id":"ncis","name":"重返犯罪現場","english":"NCIS","years":"2003–至今","seasons":"24 季","episodes":"510 集","genre":["犯罪偵查"],"tags":["軍事","友情"],"synopsis":"美國海軍犯罪調查局特別探員負責處理與海軍、海軍陸戰隊及其相關人員有關的死亡、間諜活動、恐怖威脅與重大刑案。由 Gibbs 帶領的早期團隊包含現場探員、法醫與資訊技術專家，各自以不同方法拼湊真相；隨著成員來去，後續團隊也延續這種高度合作的辦案文化。表面上每集往往是一宗獨立案件，背後卻可能牽涉軍事機密、跨國犯罪網路或內部背叛。除了調查程序，劇中也花許多篇幅描寫同事如家人般的關係、長官與下屬之間的信任，以及危險任務對私人生活的影響。許多角色在任務中培養出超越同事情誼的信任，卻也必須接受保密要求與軍中紀律。影集以單元調查吸引觀眾，再透過人物身世、離別和團隊傳承建立持續觀看的動力，讓專業技能與彼此關照同樣重要。實驗室的發現與現場訊問不一定同步，兩種辦案步驟需要不斷校正。","poster":"https://pictures.betaseries.com/fonds/poster/5c0d41603a4dad9e48e4b7dfe15ef80e.jpg","posterSource":"https://www.betaseries.com/es/article/86126-descubre-la-accion-y-el-misterio-de-ncis-la-serie-que-no-te-puedes-perder"},{"id":"criminal-minds","name":"犯罪心理","english":"Criminal Minds","years":"2005–2020；2022–至今","seasons":"19 季","episodes":"364 集","genre":["犯罪偵查"],"tags":["犯罪心理","友情"],"synopsis":"FBI 行為分析小組透過犯罪現場細節、受害者選擇、作案模式和心理側寫，預測高風險罪犯的下一步。小組成員經常搭乘專機前往全美各地，協助地方警局偵辦連續殺人、綁架及其他重大暴力案件。團隊必須分辨兇手的行為究竟源於控制慾、創傷、報復還是錯誤信念，並在下一名受害者出現前縮小追捕範圍。隨著故事延伸，探員也成為被攻擊的目標，私人關係與心理健康受到長期壓力。作品以犯罪心理學為敘事核心，同時探討專業判斷與人性脆弱如何共存。其中部分案件會揭露社會制度與犯罪之間的複雜關聯，但影集也提醒觀眾，側寫只是一種推論工具，仍需證據驗證。隨著團隊成員經歷綁架、傷亡及私人危機，劇集逐漸把心理壓力與同事支持納入主軸，形成緊張而具情感延續性的敘事。探員們必須在理解犯罪動機與同情受害者之間維持清楚界線。","poster":"https://i.ebayimg.com/images/g/~dkAAOSww8xk6QJk/s-l1200.jpg","posterSource":"https://www.impawards.com/tv/criminal_minds.html"},{"id":"csi-crime-scene-investigation","name":"CSI 犯罪現場","english":"CSI: Crime Scene Investigation","years":"2000–2015","seasons":"15 季","episodes":"337 集","genre":["犯罪偵查"],"tags":["鑑識"],"synopsis":"拉斯維加斯犯罪現場調查小組以科學鑑識破解看似無解的命案，從指紋、血跡、昆蟲、纖維到數位記錄，任何微小痕跡都有可能改變調查方向。Grissom 與後續領導者帶領團隊重建事發經過，將物證與嫌疑人的證詞逐一比對。華麗賭城背後隱藏家庭悲劇、金錢誘惑與暴力衝突，真相經常與最初的直覺相反。作品強調證據鏈、實驗室程序和跨專業合作，也描繪鑑識人員在長期目睹死亡之後，如何維持對工作的熱情與對受害者的尊重。調查過程常讓角色重新面對自己的偏見：看似有利的證詞可能與微量物證相矛盾，嫌犯也可能只是被現場巧合誤導。劇中重視一件證物從採集、檢驗到提出結論的過程，呈現科學與人際直覺彼此補足、也彼此制約的關係。也凸顯專業判讀的價值。鑑識人員必須警惕自己過早建立的假設，避免只採信符合推論的證據。","poster":"","posterSource":""},{"id":"ncis-los-angeles","name":"海軍罪案調查處：洛杉磯","english":"NCIS: Los Angeles","years":"2009–2023","seasons":"14 季","episodes":"323 集","genre":["犯罪偵查"],"tags":["軍事","諜報","動作","友情"],"synopsis":"故事轉往 NCIS 位於洛杉磯的特別行動辦公室，探員經常採取臥底身分，處理涉及國家安全、武器走私、國際間諜與恐怖組織的案件。Callen 與 Sam Hanna 是團隊核心搭檔，一人背負難以解開的身世秘密，另一人擁有軍事背景與強烈的家庭責任感。任務從街頭追查延伸至海外情報行動，隊員必須在敵我不明的環境中辨識謊言、保護線人，甚至犧牲個人安全。影集比一般鑑識警匪劇更重視動作場面與身分偽裝，也讓人物友情、愛情與忠誠成為長線故事的重要部分。辦案時經常出現真假難辨的情報與雙重身分，角色可能必須放棄熟悉的人際關係才能完成任務。高風險工作也促使小組建立強烈凝聚力，讓觀眾在追逐與槍戰之外，看見臥底者對自我身分的懷疑，以及安全與忠誠的選擇。長期臥底可能使探員無法對親密的人說出真正的職業內容。無論任務成功與否，這種保密壓力都持續影響生活。","poster":"","posterSource":""},{"id":"blue-bloods","name":"警察世家","english":"Blue Bloods","years":"2010–2024","seasons":"14 季","episodes":"293 集","genre":["犯罪偵查"],"tags":["警察辦案","家庭","社會議題"],"synopsis":"紐約 Reagan 家族有數代人投入警政與司法系統：Frank 是警察局長，子女分別擔任警探、檢察官或警察，家人的職業立場經常讓同一事件產生不同解讀。每集除了街頭犯罪、調查程序及警局內部決策，也固定安排家族共進晚餐，討論忠誠、信仰、公共責任與私人情感。當警察執法方式受到社會質疑，或親友涉入案件時，家族成員並不一定站在同一邊。作品將傳統家庭劇與程序型警匪故事結合，透過多世代視角描寫權力、倫理和親情之間難以簡單化解的矛盾。Reagan 家族每週的餐桌對話像一場小型倫理辯論，即使大家共同相信公共服務，也會對證據、媒體批評和執法改革抱持不同立場。這種設計讓警察與檢察官的制度角色並置，避免把每宗案件簡化為單一家庭成員的英雄故事。家庭成員雖然都服務於司法體系，對於何者才算正義卻未必有共識。當職責與家人利益衝突時，他們必須接受關係中的不舒服。","poster":"","posterSource":""},{"id":"chicago-p-d","name":"芝加哥警署","english":"Chicago P.D.","years":"2014–至今","seasons":"14 季","episodes":"266 集","genre":["犯罪偵查"],"tags":["警察辦案","社會議題","動作"],"synopsis":"芝加哥警察局情報組專門調查毒品交易、幫派暴力、重大謀殺與有組織犯罪，經常深入城市最危險的街區。Hank Voight 領導的團隊重視破案效率，但成員對執法底線、線人保護與訊問方式常有不同看法。小組必須與巡警、檢察官、消防員及醫院合作，在時間壓力下辨識嫌犯、營救人質、追查犯罪網路。劇情不只呈現緊張的街頭行動，也持續描寫警察文化、濫權風險與制度改革的張力。每個人都可能因個人過往而影響判斷，讓正義與忠誠的界線反覆受到挑戰。人物之間的信任會因為辦案手段和傷亡事件反覆受到考驗，有些決策甚至造成無法挽回的結果。劇集經常把街區居民的處境與執法者的私人經驗對照，讓團隊理解破案並不等於問題已經解決，城市暴力背後仍有難以消除的結構因素。成員在追捕罪犯時也需要理解受害社區長久以來對警方的不信任。","poster":"","posterSource":""},{"id":"nypd-blue","name":"紐約重案組","english":"NYPD Blue","years":"1993–2005","seasons":"12 季","episodes":"261 集","genre":["犯罪偵查"],"tags":["警察辦案","家庭","社會議題"],"synopsis":"故事聚焦紐約市警察局第十五分局的警探及其同事，從街頭命案、毒品案件到警局內部衝突，呈現高度寫實而充滿灰色地帶的警察生活。Andy Sipowicz 是劇中最具代表性的角色，脾氣暴躁、背負個人創傷，卻在長期合作與挫折中尋求改變。案件調查交織婚姻、酗酒、親子與職業倫理問題，人物經常必須面對自己造成的傷害。影集突破當時主流電視的表現尺度，以較粗礪的對白及強烈情緒刻畫執法人員，使警匪類型不再只是單純追逐兇手的程序故事。劇中角色並不是標準化的正義化身，而是會犯錯、會被偏見左右，也需要付出代價的普通人。警察工作的責任感往往和恐懼、憤怒與自我懷疑同時存在；這種寫實性與人物連續成長，讓觀眾更能理解警察體制內部的矛盾。長期輪班讓探員的婚姻與友誼都面臨考驗，有時他們只能依靠同事理解自己的處境。","poster":"","posterSource":""},{"id":"bones","name":"尋骨線索","english":"Bones","years":"2005–2017","seasons":"12 季","episodes":"246 集","genre":["犯罪偵查"],"tags":["鑑識","愛情","家庭"],"synopsis":"法醫人類學家 Temperance Brennan 以骨骼鑑定與科學分析聞名，與重視直覺和人際互動的 FBI 探員 Seeley Booth 合作，破解只剩骸骨或高度腐敗遺體的命案。Jeffersonian 研究所專家團隊擅長昆蟲學、藝術復原、電腦技術及痕跡分析，協助還原被害者身分與死亡原因。嚴謹的科學方法和直覺式偵查經常互相碰撞，卻也讓兩位主角逐漸建立信任。除了每集的懸疑案件，故事持續發展同事友情、家庭關係及主角愛情，在幽默與黑暗題材之間取得平衡。兩名主角起初幾乎代表理性與情感的兩端，長期共事後才慢慢學會尊重對方的專長。研究室成員之間的玩笑、誤會與共同生活，也讓冰冷的遺骸成為重新理解逝者人生的入口，使案件推理與角色關係同步發展。遭到忽視的骨骸讓研究團隊有機會替死者重新說出故事。透過生前物件與身體痕跡，角色試圖重建其最後的行動。科學工作因而帶有關懷他人的意義。","poster":"","posterSource":""},{"id":"csi-miami","name":"CSI 犯罪現場：邁阿密","english":"CSI: Miami","years":"2002–2012","seasons":"10 季","episodes":"232 集","genre":["犯罪偵查"],"tags":["鑑識"],"synopsis":"邁阿密犯罪現場調查隊在 Horatio Caine 帶領下，以法醫鑑識、彈道分析、數位證據與現場重建追查命案。熱帶城市明亮的海岸、豪華住宅和夜生活場景，與案件中的暴力、貪婪及隱藏秘密形成對照。團隊面對的不只有一般殺人事件，也包括毒品交易、跨境犯罪及危及公共安全的陰謀。Horatio 以冷靜而堅定的方式保護受害者，成員則在各自的專業與私人經歷中逐步成長。影集將科學辦案與高度戲劇化的視覺風格結合，重點在於細小物證如何推翻精心設計的謊言。每宗案件常由一個意外發現的物證開始，逐步揭露受害者不為人知的生活。隊員彼此之間的專業信任，會在案件變得私人化或同僚身陷危險時受到考驗。作品以鮮明色彩和快速剪接突顯現代鑑識技術的戲劇效果。邁阿密繁忙的港口和國際往來使嫌疑人來源十分多元，案件牽涉的社會階層也相當廣泛。","poster":"","posterSource":""},{"id":"jag","name":"執法悍將","english":"JAG","years":"1995–2005","seasons":"10 季","episodes":"227 集","genre":["法律"],"tags":["軍事"],"synopsis":"美國海軍軍法署軍官 Harmon Rabb 與 Sarah MacKenzie 負責處理軍人犯罪、軍事審判與涉及國家安全的法律爭議。案件可能是戰機事故、違反軍紀、間諜嫌疑，也可能發生在海外基地與作戰任務中。兩位主角一方面必須依法調查並在軍事法庭辯論，另一方面又深知軍人對命令、榮譽和同袍的責任。這些價值有時與程序正義產生衝突，讓案件不只是判斷有罪無罪。作品將法庭攻防、軍事冒險與逐漸發展的主角關係融合，也是後來《NCIS》系列的重要源頭。Rabb 曾是海軍飛行員，因此對事故與作戰任務有切身理解；Mac 則提供不同的法律專業與判斷視角。兩人的關係在競爭與信任中逐漸轉變，將嚴肅軍法與角色私生活結合，也讓軍中的榮譽觀與司法程序經常正面交鋒。軍方機構並非只有明確的命令，也存在對程序正義和指揮權的爭議。主角面對不同立場時需要保持專業。法庭內外的選擇都會影響軍人聲譽與家庭生活。","poster":"","posterSource":""},{"id":"the-blacklist","name":"黑名單","english":"The Blacklist","years":"2013–2023","seasons":"10 季","episodes":"218 集","genre":["犯罪偵查"],"tags":["懸疑","諜報","家庭","動作"],"synopsis":"神祕的國際通緝犯 雷蒙德・雷丁頓 突然向 FBI 自首，表示願意提供一份政府尚未掌握的危險犯罪者名單，但堅持只與年輕探員 伊莉莎白・基恩 合作。FBI 因此成立特別小組，追捕隱藏在金融、情報、武器與犯罪網路中的重要人物。每次破案都揭露更龐大的陰謀，而 雷丁頓 為何選中 伊莉莎白、他的真實身分及與她家人的關係，也逐漸成為核心謎團。作品結合單集追捕、長線祕密與反英雄魅力，讓觀眾不斷思考合作夥伴究竟是保護者、操縱者，還是更危險的威脅。隨著追查深入，伊莉莎白 開始懷疑自己所知道的家族故事，雷丁頓 也一次次以危險交易換取更深的信任。觀眾必須從他的話語、盟友與敵人之間判斷真偽，而團隊成員對是否應與罪犯合作，始終無法形成完全一致的答案。真正令人不安的是，合作計畫有時可能只是更深一層的操縱。角色在獲得重要情報時，也必須警惕對方索取的代價。","poster":"","posterSource":""},{"id":"law-order-criminal-intent","name":"法律與秩序：犯罪傾向","english":"Law & Order: Criminal Intent","years":"2001–2011","seasons":"10 季","episodes":"195 集","genre":["犯罪偵查"],"tags":["犯罪心理","警察辦案"],"synopsis":"紐約重大案件組處理複雜謀殺與高知名度犯罪，與《法律與秩序》本傳相比，更重視嫌犯的心理、動機及與偵探之間的智力攻防。Robert Goren 擅長觀察情緒、肢體語言和細節，搭檔 Alexandra Eames 則以扎實的現場判斷與調查能力補足他的特殊方法。觀眾經常先看到犯罪者如何策劃行動，再跟著警探理解其心理漏洞。案件涉及權力人物、藝術圈、企業與家庭關係，也讓警探面對自己情緒和職涯上的壓力。敘事特色是犯罪者與調查者彼此試探，而非只靠物證突然揭曉答案。嫌疑人有時早已出現在觀眾視野中，懸念於是轉向偵探如何推翻對方編造的心理防線。劇情也凸顯詢問技巧與關係建立的重要性：Goren 看似天馬行空的談話，往往是刻意引導對手暴露個性與矛盾。偵探需要精確理解嫌疑人如何看待自己，才能找到能夠瓦解其偽裝的問題。案件當事人的社會地位往往使詢問更為困難。","poster":"","posterSource":""},{"id":"greys-anatomy","name":"實習醫生","english":"Grey's Anatomy","years":"2005–至今","seasons":"23 季","episodes":"467 集","genre":["醫療"],"tags":["愛情","友情","家庭"],"synopsis":"Meredith Grey 與一群年輕醫師進入西雅圖教學醫院，從毫無經驗的實習生逐漸成為必須獨當一面的外科專家。面對車禍、器官移植、罕見病症及突發大型事故，他們每天都要在有限資訊和巨大風險下選擇治療方式。醫院同時也是充滿權力、競爭與親密關係的職場，導師可能變成對手，戀人也可能成為同事。故事跨越不同世代的醫療團隊，描寫友情、婚姻、失去親友、育兒與職業倦怠。劇集藉由病患的人生困境映照醫師的選擇，讓醫學倫理和個人成長成為長期主題。醫院成員之間不只有競爭，也有師徒傳承與相互療癒。觀眾隨角色成長，會發現醫師即使擅長手術，仍可能不懂得處理悲傷與親密關係。從新人的第一天到成為帶領團隊的主管，責任感的意義也不斷改變。醫師在學會精湛技術之外，更難學的是如何向家屬表達無法改變的結果。每個病患都提醒角色重新思考人生。","poster":"https://pics.filmaffinity.com/Grey_s_Anatomy_TV_Series-461638569-large.jpg","posterSource":"https://www.filmaffinity.com/us/movieimage.php?imageId=461638569"},{"id":"er","name":"急診室的春天","english":"ER","years":"1994–2009","seasons":"15 季","episodes":"331 集","genre":["醫療"],"tags":["社會議題"],"synopsis":"故事發生在芝加哥一所大型醫院的急診部門，急診醫師、住院醫師與護理人員每一天都必須處理連續湧入的危急病患。從重大外傷、兒科急症到突發傳染病，團隊需要迅速分工、判斷病況並面對無法挽回的生命損失。Mark Greene、Doug Ross、Carol Hathaway 等角色在高壓輪班中建立深厚情誼，卻也因職涯選擇、醫療錯誤與私人關係陷入困境。影集擅長以快速移動的鏡頭與多線敘事呈現急診室的混亂，並將醫院資源不均、社會弱勢與醫師的專業責任融入人物故事。急診室永遠無法事先安排下一位病患會是誰，角色常在救活某人後立刻面對另一場失敗。這種持續而快速的工作節奏，也讓人看見醫護人員在制度、資源和時間的夾縫中做決策的困難，以及團隊互信的重要。患者可能在一個夜班裡反覆經歷希望與失望，醫師必須迅速恢復專注才能繼續工作。團隊中的新人成長也不斷改變分工。","poster":"","posterSource":""},{"id":"chicago-med","name":"芝加哥醫情","english":"Chicago Med","years":"2015–至今","seasons":"12 季","episodes":"221 集","genre":["醫療"],"tags":["社會議題"],"synopsis":"芝加哥 Gaffney 醫療中心的急診醫療團隊在繁忙的醫院裡處理危重病人、疑難雜症和大型事故。醫師、護理師、精神科專家及醫院管理者必須合作，卻不時因治療優先順序、病患自主權和醫療資源發生爭執。部分病例涉及病患隱瞞的家庭祕密、財務困難或心理創傷，讓單純的醫學判斷變成倫理難題。團隊成員也面臨升遷壓力、伴侶關係和私人失落，在專業承諾與個人幸福之間尋求平衡。影集與《Chicago Fire》《Chicago P.D.》共享世界觀，經常呈現跨部門救援與案件後續。醫院管理層需要考量成本與風險，第一線醫師則經常從病患角度堅持治療，雙方因此反覆出現分歧。病例之外，角色也必須學會如何向家屬解釋難以接受的消息，或在失敗後重新面對下一位需要幫助的人。不同專科之間的合作與分歧往往影響治療，病患卻未必能理解背後的專業權衡。角色需要向家屬解釋選擇，也必須接受自己不能控制所有結果。","poster":"","posterSource":""},{"id":"chicago-fire","name":"芝加哥烈焰","english":"Chicago Fire","years":"2012–至今","seasons":"15 季","episodes":"297 集","genre":["救援"],"tags":["友情"],"synopsis":"芝加哥消防局第五十一分隊的消防員、救護技術員與隊長每天面對建築火警、交通事故、危險物質外洩以及其他緊急救援。從警鈴響起到抵達現場，隊員必須彼此信任，因為任何一個錯誤都可能危及同袍與市民生命。劇情同時描寫消防站內部的階級、訓練、領導磨合和人員更替，展現英雄形象背後的疲憊、創傷與脆弱。主角們的愛情、友情和家庭關係常受到輪班與生死風險影響。作品強調第一線救援的團隊精神，也與芝加哥警察及醫療系列交織出城市的完整緊急應變網絡。救援過程看似仰賴個人的勇敢，其實更需要事前訓練、明確指揮與夥伴默契。角色會因突發失去同事而重新檢視自己的選擇，也在協助城市居民的過程中，逐漸理解不同社群所面臨的生活困境。建立起共同的使命感。即使救援成功，隊員仍可能因事故留下難以說出口的情緒。","poster":"","posterSource":""},{"id":"9-1-1","name":"火速救援最前線","english":"9-1-1","years":"2018–至今","seasons":"10 季","episodes":"143 集","genre":["救援"],"tags":["家庭","友情"],"synopsis":"以洛杉磯警察、消防員及緊急電話接線員的工作為核心，每集從一通看似普通或極端離奇的求救電話展開，涉及火災、自然災害、交通意外與家庭危機。消防站一一八分隊成員必須在混亂現場迅速判斷風險，接線員則透過電話陪伴求救者，甚至在看不到現場的情況下協助拯救生命。Athena、Bobby、Buck 等角色在工作之外各有婚姻、親子和心理上的挑戰。劇集將高概念的災難場面與溫暖的人際敘事並置，提醒觀眾危險過後仍需要面對創傷、責任及重新建立生活的過程。不同第一線人員未必會在同一場景相遇，但他們的決定會互相影響：接線員的指引可能決定現場部署，警察與醫療團隊也必須接手後續處置。角色們因此體認到，緊急救援既是一門技術，也是一種長期的人際承諾。從接通緊急電話到送醫治療，一次事故經常牽涉多個看不見的工作環節。","poster":"","posterSource":""},{"id":"scrubs","name":"實習醫生風雲","english":"Scrubs","years":"2001–2010；2026–至今","seasons":"10 季","episodes":"191 集","genre":["情境喜劇"],"tags":["醫療","友情"],"synopsis":"年輕醫師 J.D. 進入 Sacred Heart 醫院，與好友 Turk、同事 Elliot 及個性古怪的醫護團隊共同學習如何行醫。J.D. 經常以天馬行空的幻想呈現內心想法，讓高壓病房與荒謬的職場關係轉變成喜劇場景。看似胡鬧的故事卻常突然轉向嚴肅的生死議題，從病患死亡、醫療失誤到醫師無法承認自己的脆弱，都讓角色逐漸成熟。嚴格的 Cox 醫師既是 J.D. 的精神導師，也是最常批評他的人。多年後的回歸篇章再度讓老朋友在醫院重逢，呈現醫療制度與新人世代改變之下，友情和職業理想如何持續接受考驗。J.D. 的內心旁白讓觀眾接觸一名醫師在喜劇外表下的焦慮與自我懷疑，某些看似好笑的情節最後卻引向令人難忘的悲傷。這種情緒反差凸顯醫療工作真正的困難並非只有知識，而是與人相處及接受無能為力。醫院裡的荒謬笑話經常來自真實存在的上下級關係與職場壓力。當角色回到病床前，仍需認真面對每個生命。","poster":"","posterSource":""},{"id":"modern-family","name":"摩登家庭","english":"Modern Family","years":"2009–2020","seasons":"11 季","episodes":"250 集","genre":["情境喜劇"],"tags":["家庭"],"synopsis":"以假紀錄片風格跟拍三個彼此有親屬關係、家庭形式卻截然不同的家庭：Jay 與年輕妻子 Gloria 的重組家庭、Claire 和 Phil 的五口之家，以及 Mitchell、Cameron 的同志家庭。每集透過訪談與生活現場交錯呈現孩子教育、夫妻摩擦、兄弟姊妹競爭和世代觀念差異。人物常因想證明自己是好父母或好伴侶而做出笨拙選擇，最後卻在混亂中重新理解對方。作品不把家庭定義成單一模樣，而是用幽默與溫情描寫不同個性的人如何在長期相處中形成共同生活的默契。角色之間常因害怕被批評，而試圖掩飾自己脆弱或不完美的一面；訪談鏡頭則揭露他們真正的想法。隨著孩子長大、父母逐漸老去，家庭成員對幸福與成功的想像也不斷調整，留下細膩的情感變化。孩子們對父母的反抗往往來自渴望被理解，父母卻容易誤認成不聽話。訪談鏡頭揭露角色說不出口的想法。每個家庭都必須學習尊重差異。","poster":"https://cdn1.clickthecity.com/images/tv/poster/600/1774.jpg","posterSource":"https://www.clickthecity.com/tv/series/4c2401/modern-family"},{"id":"friends","name":"六人行","english":"Friends","years":"1994–2004","seasons":"10 季","episodes":"236 集","genre":["情境喜劇"],"tags":["友情","愛情"],"synopsis":"瑞秋、莫妮卡、菲比、喬伊、錢德勒 和 羅斯 六名年輕人在紐約曼哈頓生活，常在咖啡館 Central Perk 或彼此公寓聚會。從事不同職業的他們經歷求職、失業、戀愛、分手、結婚和生育，並在各種尷尬時刻互相陪伴。羅斯 與 瑞秋 的感情起伏、莫妮卡 與 錢德勒 的關係，以及其他角色對未來的不同追求，構成長線故事。影集以生活化的對話、固定場景與角色默契呈現都市青年從二十多歲走向成熟的過程。六人的個性差異經常製造笑話，也證明友誼可以成為遠離家鄉的人們最重要的情感支持。六人常在工作失敗或感情受挫後回到同一張沙發聊天，形成超越血緣的家庭感。故事沒有單一英雄，而是靠群像之間的互動推進；即使角色各有任性、自卑與缺點，仍會陪伴朋友做出重大人生選擇。六人對於成功、婚姻與家庭的想像各不相同，人生進度也從來不一致。彼此之間的小習慣總能引發笑點。","poster":"https://image.tmdb.org/t/p/original/abmbzIOIVhOUBFyHcJuWnXl9OpU.jpg","posterSource":"https://www.themoviedb.org/tv/1668-friends/images/posters"},{"id":"curb-your-enthusiasm","name":"人生如戲","english":"Curb Your Enthusiasm","years":"2000–2024","seasons":"12 季","episodes":"120 集","genre":["情境喜劇"],"tags":[],"synopsis":"《歡樂單身派對》創作者 Larry David 在劇中飾演自己誇張化的版本，已經擁有財富與事業成功，卻總在日常人際禮儀上與所有人發生衝突。從餐廳訂位、停車習慣、朋友聚會到慈善活動，Larry 對不合理規則的執著和毫不妥協的坦率，常讓小誤會一路擴大。配角們各有敏感點，沒有人能完全避開他的冒犯。影集以即興感很強的對話和層層堆疊的尷尬情境建立笑點，讓觀眾在同情與厭煩主角之間擺盪。它也透過微小社交衝突，諷刺名流文化、社會規範及人們對公平的矛盾期待。Larry 經常認為自己只是在指出別人不願承認的問題，卻沒察覺自己的行為同樣缺乏同理心。隨著一連串小決定彼此牽連，尷尬逐步累積到荒謬結局，讓觀眾思考社交規則究竟保護了誰。一個微不足道的社交失誤可能牽連整場聚會，主角卻固執地認為自己毫無過錯。朋友的忍耐也有極限。","poster":"","posterSource":""},{"id":"shameless","name":"無恥之徒（美版）","english":"Shameless","years":"2011–2021","seasons":"11 季","episodes":"134 集","genre":["家庭劇"],"tags":["家庭","黑色幽默","社會議題"],"synopsis":"芝加哥南區的 Gallagher 家庭長期生活在貧困與混亂之中，父親 Frank 不負責任又沉迷酒精，長女 Fiona 因此必須提早擔起照顧弟妹的責任。每名孩子都想透過學業、工作、愛情或投機機會離開困境，卻常被家庭責任和自身缺點拉回現實。故事包含失業、債務、醫療、成癮與社會制度的矛盾，也不迴避性、犯罪與道德灰色地帶。即使家人彼此爭吵、撒謊甚至傷害對方，仍難以切斷情感連結。影集以尖銳黑色幽默描寫勞工階級的生存困境，讓荒謬喜劇與沉重現實不斷交錯。每個孩子試圖逃脫家庭困境的方式都不同，有人選擇照顧他人，有人則複製父親的破壞行為。影集不輕易將貧窮浪漫化，也不把人物當作單純的受害者，而是讓他們在荒謬失敗中不斷尋找尊嚴與自由。貧窮讓許多角色難以擁有選擇自由，家庭成員也因此不斷尋找短暫的生存策略。失敗雖然經常出現，他們仍試圖重建生活。","poster":"","posterSource":""},{"id":"tyler-perry-s-sistas","name":"姊妹心事","english":"Tyler Perry's Sistas","years":"2019–至今","seasons":"10 季","episodes":"215 集","genre":["人物關係劇"],"tags":["友情","愛情"],"synopsis":"Andi、Karen、Danni 和 Sabrina 是一群在現代都市中生活的黑人單身女性，各自擁有不同的職業、個性與情感期待。她們在工作上努力尋求成就，感情生活卻經常牽涉不信任、複雜的舊關係、承諾落差與自我價值的拉扯。朋友們常在聚會中討論戀愛困境，互相提出建議，卻也因判斷不同而起衝突。故事延伸至伴侶、前任、家庭與同事，讓友情支持與個人獨立成為重要主線。作品關注社群媒體、現代約會文化及社會對女性的期待，呈現人在追求愛情與事業時如何界定尊重、界線與真正的幸福。四名女性對感情的標準並不相同，因此朋友的建議可能帶來力量，也可能引發新的誤解。她們必須在個人界線與維護關係之間做決定。影集藉由多條交錯的生活主線，描述現代都會女性如何共同成長。朋友可能勇於替彼此發聲，卻不總能在自己的感情中採取相同標準。職涯抉擇也影響她們對未來的想像。","poster":"","posterSource":""}];
let selectedGenre=null;
const selectedTags=new Set();
let mode='and';
let onlySaved=false;
const STORAGE_KEY='tv-series-library-watchlist-v1';
let saved=new Set();
try{const arr=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');if(Array.isArray(arr))saved=new Set(arr.filter(id=>shows.some(s=>s.id===id)))}catch(_e){}
const $=id=>document.getElementById(id);
const bookmarkSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 4.6A1.6 1.6 0 0 1 7.6 3h8.8A1.6 1.6 0 0 1 18 4.6V21l-6-4-6 4V4.6Z"/></svg>';
const make=(tag,className,text)=>{const e=document.createElement(tag);if(className)e.className=className;if(text!==undefined)e.textContent=text;return e};
// A show has exactly one Genre; TAGS are independent, multi-select characteristics.
// The genre-level medical/family categories also imply the corresponding search TAG.
function effectiveTags(s){
 const set=new Set(s.tags);
 if(s.genre[0]==='醫療')set.add('醫療');
 if(s.genre[0]==='家庭劇')set.add('家庭');
 return set;
}
const availableTags=tags.filter(t=>shows.some(s=>effectiveTags(s).has(t)));
function renderChips(){
 const genreWrap=$('genre-chips');genreWrap.replaceChildren();
 for(const genre of genres){
  const btn=make('button','chip',genre);btn.type='button';btn.dataset.genre=genre;
  btn.setAttribute('aria-pressed',String(selectedGenre===genre));
  btn.addEventListener('click',()=>{selectedGenre=selectedGenre===genre?null:genre;renderChips();renderList()});
  genreWrap.appendChild(btn);
 }
 const tagWrap=$('tag-chips');tagWrap.replaceChildren();
 for(const tag of availableTags){
  const btn=make('button','chip',tag);btn.type='button';btn.dataset.tag=tag;
  btn.setAttribute('aria-pressed',String(selectedTags.has(tag)));
  btn.addEventListener('click',()=>{selectedTags.has(tag)?selectedTags.delete(tag):selectedTags.add(tag);renderChips();renderList()});
  tagWrap.appendChild(btn);
 }
}
function isMatch(s){
 if(selectedGenre && s.genre[0]!==selectedGenre)return false;
 if(selectedTags.size){
  const own=effectiveTags(s);const chosen=[...selectedTags];
  if(!(mode==='and'?chosen.every(t=>own.has(t)):chosen.some(t=>own.has(t))))return false;
 }
 if(onlySaved&&!saved.has(s.id))return false;
 return true;
}
function syncButtons(){document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));$('watch-filter').setAttribute('aria-pressed',String(onlySaved));$('saved-count').textContent=String(saved.size)}

// Posters for the demo entries use their existing links; other show posters are resolved
// only when the row enters the viewport. TVmaze permits public show lookup.
const posterPromises=new Map();
const posterJobs=[];
let processingPosters=false;
async function drainPosterJobs(){
 if(processingPosters)return;
 processingPosters=true;
 while(posterJobs.length){
  const item=posterJobs.shift();let url='';
  try{
   const response=await fetch('https://api.tvmaze.com/singlesearch/shows?q='+encodeURIComponent(item.show.posterQuery||item.show.english));
   if(response.ok){const result=await response.json();url=result?.image?.medium||result?.image?.original||''}
  }catch(_error){}
  if(!/^https:\/\//.test(url))url='';
  item.resolve(url);
  if(posterJobs.length)await new Promise(resolve=>setTimeout(resolve,650));
 }
 processingPosters=false;
}
function fetchPoster(s){
 if(s.poster)return Promise.resolve(s.poster);
 if(!posterPromises.has(s.id)){
  posterPromises.set(s.id,new Promise(resolve=>{posterJobs.push({show:s,resolve});drainPosterJobs()}));
 }
 return posterPromises.get(s.id);
}
const posterObserver=('IntersectionObserver' in window)?new IntersectionObserver(items=>{
 for(const item of items){if(item.isIntersecting){posterObserver.unobserve(item.target);item.target.__fetchPoster?.()}}
},{rootMargin:'280px'}):null;
function setPoster(s,img,container){
 img.style.visibility='hidden';
 img.onload=()=>{img.style.visibility='visible'};
 img.onerror=()=>{img.style.display='none'};
 if(s.poster){img.src=s.poster;return}
 container.__fetchPoster=()=>fetchPoster(s).then(url=>{if(url){s.poster=url;img.src=url}});
 if(posterObserver)posterObserver.observe(container);
 else container.__fetchPoster();
}
function renderList(){
 const matching=shows.filter(isMatch);$('result-count').innerHTML='顯示 <strong>'+matching.length+'</strong> 部影集';syncButtons();const root=$('series-list');root.replaceChildren();
 if(!matching.length){const empty=make('div','empty');empty.appendChild(make('h3','',onlySaved&&saved.size===0?'還沒有加入待看影集':'找不到符合條件的影集'));empty.appendChild(make('p','',onlySaved&&saved.size===0?'先瀏覽全部影集，將感興趣的作品加入待看清單。':'請調整類型或主題與特色，或清除篩選條件。'));const btn=make('button','', '顯示全部影集');btn.type='button';btn.addEventListener('click',()=>{selectedGenre=null;selectedTags.clear();onlySaved=false;renderChips();renderList()});empty.appendChild(btn);root.appendChild(empty);return}
 for(const s of matching){
  const row=make('article','series');row.setAttribute('aria-label',s.name+' '+s.english);
  const poster=make('div','poster');const fallback=make('div','poster-fallback',s.english);poster.appendChild(fallback);
  const img=make('img','');img.alt=s.name+'影集宣傳海報';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';poster.appendChild(img);setPoster(s,img,poster);row.appendChild(poster);
  const content=make('div','series-body');const head=make('div','series-head');
  const top=make('div','series-top');const titles=make('div','');titles.appendChild(make('h3','',s.name));titles.appendChild(make('p','english',s.english));top.appendChild(titles);
  const isSaved=saved.has(s.id);const save=make('button','save');save.type='button';save.dataset.save=s.id;save.setAttribute('aria-pressed',String(isSaved));save.setAttribute('aria-label',(isSaved?'從待看清單移除':'加入待看清單：')+s.name);save.innerHTML=bookmarkSvg+'<span>'+(isSaved?'已加入待看':'加入待看')+'</span>';
  save.addEventListener('click',()=>{if(saved.has(s.id))saved.delete(s.id);else saved.add(s.id);try{localStorage.setItem(STORAGE_KEY,JSON.stringify([...saved]))}catch(_e){}renderList()});top.appendChild(save);head.appendChild(top);
  const facts=make('div','facts');for(const v of [s.years,s.seasons,s.episodes])facts.appendChild(make('span','',v));head.appendChild(facts);
  const tagList=make('div','tags');for(const t of [...s.genre,...s.tags])tagList.appendChild(make('span','mini-tag',t));head.appendChild(tagList);content.appendChild(head);
  content.appendChild(make('p','synopsis',s.synopsis));row.appendChild(content);root.appendChild(row)
 }
}
$('reset').addEventListener('click',()=>{selectedGenre=null;selectedTags.clear();renderChips();renderList()});document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;renderList()}));$('watch-filter').addEventListener('click',()=>{onlySaved=!onlySaved;renderList()});
$('poster-credits').innerHTML='部分海報由 <a class="source-link" href="https://www.tvmaze.com/" target="_blank" rel="noopener noreferrer">TVmaze</a> 提供；其他宣傳海報參考來源包含 TMDb、JustWatch、FilmAffinity、IMP Awards 等。';
renderChips();renderList();
</script>
