<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>TV SERIES LIBRARY — Interactive Demo</title>
<style>
:root{--paper:#F8F7F1;--sage-bg:#E9EDE5;--deep:#33483A;--accent:#59725E;--ink:#334036;--muted:#728073;--line:#D9E0D5;--chip:#FCFDF9;--white:#FFFFFF;--rounded:14px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid #85A98A;outline-offset:3px}button{cursor:pointer}a{color:var(--accent)}
.page{max-width:1160px;padding:0 35px;margin:auto}.site-head{padding:66px 0 39px;border-bottom:1px solid var(--line)}.overline{display:flex;align-items:center;gap:14px;font-size:11px;font-weight:720;letter-spacing:2px;color:var(--accent)}.overline:before{content:"";height:1px;width:28px;background:var(--accent)}h1{font-family:Georgia,'Times New Roman',serif;font-weight:500;font-size:clamp(36px,5.4vw,64px);letter-spacing:-2.2px;line-height:1.1;color:var(--deep);margin:18px 0 12px}.demo-tag{display:inline-flex;align-items:center;gap:8px;background:#EAF0E8;color:#456049;border:1px solid #D5E0D2;font-size:11px;border-radius:50px;padding:7px 11px;margin-top:19px;font-weight:650}.demo-tag::before{content:"";height:6px;width:6px;border-radius:50%;background:#719779}
.explore{padding:35px 0 32px;border-bottom:1px solid var(--line)}.explore-heading{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:22px}.section-eyebrow{font-size:11px;letter-spacing:1.8px;color:var(--accent);font-weight:750;margin:0 0 10px}.explore h2{font-size:23px;color:var(--deep);margin:0 0 9px;font-weight:650;letter-spacing:0.5px}.helper{font-size:13px;color:var(--muted);margin:0;line-height:1.8}.filter-row{display:grid;grid-template-columns:82px 1fr;gap:20px;align-items:start;margin:18px 0}.filter-label{font-weight:650;color:#647966;font-size:12px;padding-top:8px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--chip);color:var(--accent);border:1px solid #D2DCCF;border-radius:100px;font-size:12px;padding:8px 13px;line-height:1.15;transition:background .14s,color .14s,transform .14s}.chip:hover{background:#EDF3EA}.chip[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}.chip[aria-pressed="true"]:before{content:'✓ ';font-weight:700}.chip:active{transform:scale(.98)}
.tool-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:25px 0 0;padding:19px 0 0;border-top:1px solid var(--line)}.mode{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.mode-label{font-size:12px;color:var(--muted);font-weight:650}.segment{display:inline-flex;align-items:center;background:#E9EDE6;padding:4px;border-radius:10px}.segment button{border:0;background:transparent;color:#607361;border-radius:8px;padding:8px 12px;font-size:12px}.segment button[aria-pressed="true"]{background:#fff;color:var(--deep);box-shadow:0 1px 3px #2636241A;font-weight:700}.clear{border:0;background:transparent;color:var(--accent);font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:8px 2px}.clear:hover{color:var(--deep)}
.results-bar{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:31px 0 9px}.results-title{font-size:13px;color:var(--muted);margin:0}.results-title strong{color:var(--deep);font-size:18px;padding:0 3px}.watch-filter{display:flex;align-items:center;gap:10px;border:1px solid #C9D6C9;border-radius:100px;color:var(--deep);padding:10px 14px;background:transparent;font-size:12px;white-space:nowrap}.watch-filter[aria-pressed="true"]{background:var(--deep);color:#fff;border-color:var(--deep)}.watch-filter .count{display:inline-grid;place-items:center;border-radius:50%;width:19px;height:19px;background:#DDE6DA;color:#425B45;font-size:11px;font-weight:800}.watch-filter[aria-pressed="true"] .count{background:#F4F6F2}.watch-filter svg{width:15px;height:15px}
.series{display:grid;grid-template-columns:170px minmax(0,1fr);gap:28px;padding:39px 0 42px;border-bottom:1px solid var(--line)}.series:last-child{border-bottom:none}.poster{width:170px;height:250px;border-radius:7px;position:relative;overflow:hidden;background:linear-gradient(150deg,#CBD6CB 0%,#7E9282 58%,#3C5848 100%);box-shadow:0 5px 16px #4A61451C}.poster img{height:100%;width:100%;display:block;object-fit:cover;object-position:center top;position:absolute;inset:0}.poster-fallback{color:#FAF9F3;text-align:center;padding:30px 12px;display:grid;place-items:center;height:100%;font-family:Georgia,serif;font-size:20px;line-height:1.3;font-weight:600;letter-spacing:-.3px}.poster-fallback::before{content:'✦';font-size:32px;opacity:.6;position:absolute;top:16px;left:16px}.series-body{min-width:0}.series-top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.series h3{font-size:clamp(22px,2.4vw,28px);font-weight:670;letter-spacing:.2px;margin:0 0 5px;line-height:1.35;color:var(--deep)}.english{font-family:Georgia,'Times New Roman',serif;font-size:16px;color:#748676;margin:0 0 18px}.save{display:flex;align-items:center;gap:7px;flex:none;padding:9px 13px;background:transparent;border-radius:9px;border:1px solid #BCCBBF;color:var(--accent);font-size:12px;white-space:nowrap;transition:background .1s}.save:hover{background:#EEF3EB}.save[aria-pressed="true"]{background:#E5EEE3;border-color:#9EB79F;color:#36573E}.save svg{width:15px;height:15px}.facts{display:flex;flex-wrap:wrap;gap:0;align-items:center;margin-bottom:12px}.facts span{display:inline-flex;align-items:center;color:#5E705F;font-size:12px;font-weight:600;line-height:1.7}.facts span+span:before{content:'·';display:inline-block;margin:0 10px;color:#91A393}.tags{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 22px}.mini-tag{background:#EBF0E9;color:#536D57;font-size:11px;border-radius:5px;padding:5px 8px;line-height:1.3}.synopsis{font-size:14px;letter-spacing:.18px;line-height:1.93;color:#424F44;margin:0;text-align:left;overflow-wrap:anywhere}.empty{margin:42px 0 70px;padding:55px 25px;background:#EFF2EA;border-radius:var(--rounded);text-align:center;color:#536955}.empty h3{margin:0 0 8px;font-size:19px}.empty p{margin:0 0 18px;font-size:13px}.empty button{border:1px solid #AFC3AD;color:#466849;background:#fff;padding:9px 16px;border-radius:8px}
footer{padding:36px 0 60px;border-top:1px solid var(--line);font-size:11px;color:#859185;line-height:1.9}footer p{margin:4px 0}.source-link{color:#6E806D;text-decoration:underline;text-underline-offset:3px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:800px){.page{padding:0 24px}.site-head{padding:52px 0 31px}.filter-row{grid-template-columns:1fr;gap:8px}.filter-label{padding-top:0}.series{grid-template-columns:134px minmax(0,1fr);gap:20px}.poster{width:134px;height:198px}.series-top{flex-direction:column;gap:12px}.english{margin-bottom:10px}.series h3{font-size:23px}.save{padding:8px 11px}.tags{margin-bottom:14px}}
@media(max-width:600px){.page{padding:0 18px}.site-head{padding:44px 0 27px}.overline{font-size:10px}h1{font-size:38px;letter-spacing:-1.6px}.explore{padding:27px 0}.explore h2{font-size:21px}.chips{gap:7px}.chip{font-size:12px;padding:9px 12px}.tool-row{margin-top:18px}.results-bar{padding-top:24px}.series{grid-template-columns:104px minmax(0,1fr);column-gap:17px;row-gap:16px;padding:31px 0}.poster{width:104px;height:156px}.series h3{font-size:21px}.english{font-size:14px;line-height:1.3;margin:0 0 10px}.series-top{gap:9px}.save{font-size:11px;padding:7px 9px}.facts{gap:0;margin:4px 0 8px}.facts span{font-size:11px}.facts span+span:before{margin:0 6px}.tags{gap:5px}.mini-tag{font-size:10px;padding:5px 7px}.synopsis{grid-column:1/-1;font-size:13px;line-height:1.9}.series-body{display:contents}.series-head{grid-column:2}.series .synopsis{grid-column:1/-1}.series .title-and-meta{grid-column:2}.series article{min-width:0}.series .series-top{align-items:start}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.chip{transition:none}}
</style>
</head>
<body>
<div class="page">
 <header class="site-head">
  <div class="overline">A COLLECTION OF TIMELESS STORIES</div>
  <h1>TV SERIES LIBRARY</h1>
  
 </header>
 <main>
  <section class="explore" aria-labelledby="explore-title">
   <div class="explore-heading"><div><p class="section-eyebrow">DISCOVER BY GENRE &amp; THEME</p><h2 id="explore-title">探索感興趣的故事</h2><p class="helper">標籤可複選，也可以選擇「全部符合」或「符合任一」。</p></div></div>
   <div class="filter-row"><div class="filter-label">GENRE｜類型</div><div class="chips" id="genre-chips" role="group" aria-label="影集類型篩選"></div></div>
   <div class="filter-row"><div class="filter-label">THEME｜主題</div><div class="chips" id="theme-chips" role="group" aria-label="故事主題篩選"></div></div>
   <div class="tool-row"><div class="mode"><span class="mode-label">篩選方式</span><div class="segment" role="group" aria-label="篩選邏輯"><button type="button" data-mode="and" aria-pressed="true">全部符合 AND</button><button type="button" data-mode="or" aria-pressed="false">符合任一 OR</button></div></div><button class="clear" type="button" id="reset">清除類型標籤</button></div>
  </section>
  <div class="results-bar"><p class="results-title" id="result-count" aria-live="polite">顯示 <strong>49</strong> 部影集</p><button class="watch-filter" type="button" id="watch-filter" aria-pressed="false" aria-label="只顯示我的待看清單"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 4.6A1.6 1.6 0 0 1 7.6 3h8.8A1.6 1.6 0 0 1 18 4.6V21l-6-4-6 4V4.6Z"/></svg>只看待看 <span class="count" id="saved-count">0</span></button></div>
  <div class="series-list" id="series-list" aria-live="polite"></div>
 </main>
 <footer><p>收錄 49 部經典美國真人影集，依類型與主題探索。</p><p>海報圖片由外部來源提供，需連線使用；版權屬原權利人。待看清單保存在此瀏覽器，不會跨裝置同步。</p><p id="poster-credits"></p></footer>
</div>
<script>
'use strict';
const genres=["犯罪", "警匪", "法律", "偵探", "醫療", "救援", "情境喜劇", "家庭劇", "青春劇", "都會劇", "科幻", "奇幻", "恐怖", "懸疑", "動作", "超級英雄", "歷史劇", "西部"];
const themes=["家庭", "友情", "愛情", "職場", "政治", "軍事", "成長", "冒險", "心理", "黑色幽默", "社會議題", "超自然", "末日生存", "商業權力"];
const shows=[{"id":"law-and-order-special-victims-unit","name":"法律與秩序：特殊受害者","english":"Law & Order: Special Victims Unit","years":"1999–至今","seasons":"28 季","episodes":"596 集","genre":["犯罪","警匪","法律"],"theme":["職場","心理","社會議題"],"synopsis":"故事以紐約市警察局特殊受害者組為中心，調查性侵、家庭暴力、虐童及涉及弱勢者的嚴重犯罪。Olivia Benson 從第一線警探逐漸成長為團隊領導者，與同事在案發現場、訊問室及法庭之間尋找證據。不同案件常反映社會真實爭議，受害者未必願意作證，證人也可能因恐懼、權力或親密關係而保持沉默。警探不只需要確認犯人，更要理解創傷如何影響證詞及人際信任。劇情也描寫調查者面對輿論、制度限制與個人情感時，如何在保護當事人和堅守程序正義之間做出選擇。Benson 對受害者的同理心是敘事重點，但她也必須提防情感介入影響判斷。隨著同事升遷、離職與新成員加入，組內辦案方式持續改變；劇集因此兼具單元案件和長期角色成長，也呈現社會如何重新理解性犯罪與權力不對等。辦案人員常必須向家屬解釋為何司法結果無法立即到來。","poster":"https://images.justwatch.com/poster/335509310/s718/law-and-order-special-victims-unit.jpg","posterSource":"https://www.justwatch.com/us/tv-show/law-and-order-special-victims-unit"},{"id":"law-order","name":"法律與秩序","english":"Law & Order","years":"1990–2010；2022–至今","seasons":"26 季","episodes":"546 集","genre":["犯罪","警匪","法律"],"theme":["職場","社會議題"],"synopsis":"本劇以紐約市形形色色的刑事案件為出發點，前半段跟隨警探走訪現場、尋找目擊者、追查嫌疑人，後半段則由地方檢察官整理證據、準備起訴並在法庭上交鋒。同一事件在警方與檢方眼中可能呈現不同面貌，證據是否能合法使用，也會直接左右審判結果。故事常借鑑社會新聞，討論階級、宗教、種族、金錢與公職權力造成的衝突。角色並非總能找到毫無爭議的答案，有時必須在法律文字、證人利益與公眾期待之間選擇代價較小的道路，呈現刑事司法制度的複雜性。劇集不提供簡單的善惡二分：掌握真相的人不一定能獲得有罪判決，警方認定的嫌疑人也可能因程序問題獲釋。正因每個環節都會改變案件方向，觀眾能看見從逮捕到起訴之間的分工，以及司法改革與現實限制的拉鋸。檢察官有時必須放棄情感上令人信服、法律上卻無法成立的主張。","poster":"","posterSource":""},{"id":"ncis","name":"重返犯罪現場","english":"NCIS","years":"2003–至今","seasons":"24 季","episodes":"510 集","genre":["犯罪","警匪","偵探"],"theme":["軍事","職場","友情"],"synopsis":"美國海軍犯罪調查局特別探員負責處理與海軍、海軍陸戰隊及其相關人員有關的死亡、間諜活動、恐怖威脅與重大刑案。由 Gibbs 帶領的早期團隊包含現場探員、法醫與資訊技術專家，各自以不同方法拼湊真相；隨著成員來去，後續團隊也延續這種高度合作的辦案文化。表面上每集往往是一宗獨立案件，背後卻可能牽涉軍事機密、跨國犯罪網路或內部背叛。除了調查程序，劇中也花許多篇幅描寫同事如家人般的關係、長官與下屬之間的信任，以及危險任務對私人生活的影響。許多角色在任務中培養出超越同事情誼的信任，卻也必須接受保密要求與軍中紀律。影集以單元調查吸引觀眾，再透過人物身世、離別和團隊傳承建立持續觀看的動力，讓專業技能與彼此關照同樣重要。實驗室的發現與現場訊問不一定同步，兩種辦案步驟需要不斷校正。","poster":"https://pictures.betaseries.com/fonds/poster/5c0d41603a4dad9e48e4b7dfe15ef80e.jpg","posterSource":"https://www.betaseries.com/es/article/86126-descubre-la-accion-y-el-misterio-de-ncis-la-serie-que-no-te-puedes-perder"},{"id":"criminal-minds","name":"犯罪心理","english":"Criminal Minds","years":"2005–2020；2022–至今","seasons":"19 季","episodes":"364 集","genre":["犯罪","偵探","懸疑"],"theme":["心理","職場","友情"],"synopsis":"FBI 行為分析小組透過犯罪現場細節、受害者選擇、作案模式和心理側寫，預測高風險罪犯的下一步。小組成員經常搭乘專機前往全美各地，協助地方警局偵辦連續殺人、綁架及其他重大暴力案件。團隊必須分辨兇手的行為究竟源於控制慾、創傷、報復還是錯誤信念，並在下一名受害者出現前縮小追捕範圍。隨著故事延伸，探員也成為被攻擊的目標，私人關係與心理健康受到長期壓力。作品以犯罪心理學為敘事核心，同時探討專業判斷與人性脆弱如何共存。其中部分案件會揭露社會制度與犯罪之間的複雜關聯，但影集也提醒觀眾，側寫只是一種推論工具，仍需證據驗證。隨著團隊成員經歷綁架、傷亡及私人危機，劇集逐漸把心理壓力與同事支持納入主軸，形成緊張而具情感延續性的敘事。探員們必須在理解犯罪動機與同情受害者之間維持清楚界線。","poster":"https://i.ebayimg.com/images/g/~dkAAOSww8xk6QJk/s-l1200.jpg","posterSource":"https://www.impawards.com/tv/criminal_minds.html"},{"id":"csi-crime-scene-investigation","name":"CSI 犯罪現場","english":"CSI: Crime Scene Investigation","years":"2000–2015","seasons":"15 季","episodes":"337 集","genre":["犯罪","偵探","懸疑"],"theme":["職場","心理"],"synopsis":"拉斯維加斯犯罪現場調查小組以科學鑑識破解看似無解的命案，從指紋、血跡、昆蟲、纖維到數位記錄，任何微小痕跡都有可能改變調查方向。Grissom 與後續領導者帶領團隊重建事發經過，將物證與嫌疑人的證詞逐一比對。華麗賭城背後隱藏家庭悲劇、金錢誘惑與暴力衝突，真相經常與最初的直覺相反。作品強調證據鏈、實驗室程序和跨專業合作，也描繪鑑識人員在長期目睹死亡之後，如何維持對工作的熱情與對受害者的尊重。調查過程常讓角色重新面對自己的偏見：看似有利的證詞可能與微量物證相矛盾，嫌犯也可能只是被現場巧合誤導。劇中重視一件證物從採集、檢驗到提出結論的過程，呈現科學與人際直覺彼此補足、也彼此制約的關係。也凸顯專業判讀的價值。鑑識人員必須警惕自己過早建立的假設，避免只採信符合推論的證據。","poster":"","posterSource":""},{"id":"ncis-los-angeles","name":"海軍罪案調查處：洛杉磯","english":"NCIS: Los Angeles","years":"2009–2023","seasons":"14 季","episodes":"323 集","genre":["犯罪","警匪","動作"],"theme":["軍事","職場","友情"],"synopsis":"故事轉往 NCIS 位於洛杉磯的特別行動辦公室，探員經常採取臥底身分，處理涉及國家安全、武器走私、國際間諜與恐怖組織的案件。Callen 與 Sam Hanna 是團隊核心搭檔，一人背負難以解開的身世秘密，另一人擁有軍事背景與強烈的家庭責任感。任務從街頭追查延伸至海外情報行動，隊員必須在敵我不明的環境中辨識謊言、保護線人，甚至犧牲個人安全。影集比一般鑑識警匪劇更重視動作場面與身分偽裝，也讓人物友情、愛情與忠誠成為長線故事的重要部分。辦案時經常出現真假難辨的情報與雙重身分，角色可能必須放棄熟悉的人際關係才能完成任務。高風險工作也促使小組建立強烈凝聚力，讓觀眾在追逐與槍戰之外，看見臥底者對自我身分的懷疑，以及安全與忠誠的選擇。長期臥底可能使探員無法對親密的人說出真正的職業內容。無論任務成功與否，這種保密壓力都持續影響生活。","poster":"","posterSource":""},{"id":"blue-bloods","name":"警察世家","english":"Blue Bloods","years":"2010–2024","seasons":"14 季","episodes":"293 集","genre":["犯罪","警匪"],"theme":["家庭","職場","社會議題"],"synopsis":"紐約 Reagan 家族有數代人投入警政與司法系統：Frank 是警察局長，子女分別擔任警探、檢察官或警察，家人的職業立場經常讓同一事件產生不同解讀。每集除了街頭犯罪、調查程序及警局內部決策，也固定安排家族共進晚餐，討論忠誠、信仰、公共責任與私人情感。當警察執法方式受到社會質疑，或親友涉入案件時，家族成員並不一定站在同一邊。作品將傳統家庭劇與程序型警匪故事結合，透過多世代視角描寫權力、倫理和親情之間難以簡單化解的矛盾。Reagan 家族每週的餐桌對話像一場小型倫理辯論，即使大家共同相信公共服務，也會對證據、媒體批評和執法改革抱持不同立場。這種設計讓警察與檢察官的制度角色並置，避免把每宗案件簡化為單一家庭成員的英雄故事。家庭成員雖然都服務於司法體系，對於何者才算正義卻未必有共識。當職責與家人利益衝突時，他們必須接受關係中的不舒服。","poster":"","posterSource":""},{"id":"chicago-p-d","name":"芝加哥警署","english":"Chicago P.D.","years":"2014–至今","seasons":"14 季","episodes":"266 集","genre":["犯罪","警匪"],"theme":["職場","社會議題"],"synopsis":"芝加哥警察局情報組專門調查毒品交易、幫派暴力、重大謀殺與有組織犯罪，經常深入城市最危險的街區。Hank Voight 領導的團隊重視破案效率，但成員對執法底線、線人保護與訊問方式常有不同看法。小組必須與巡警、檢察官、消防員及醫院合作，在時間壓力下辨識嫌犯、營救人質、追查犯罪網路。劇情不只呈現緊張的街頭行動，也持續描寫警察文化、濫權風險與制度改革的張力。每個人都可能因個人過往而影響判斷，讓正義與忠誠的界線反覆受到挑戰。人物之間的信任會因為辦案手段和傷亡事件反覆受到考驗，有些決策甚至造成無法挽回的結果。劇集經常把街區居民的處境與執法者的私人經驗對照，讓團隊理解破案並不等於問題已經解決，城市暴力背後仍有難以消除的結構因素。成員在追捕罪犯時也需要理解受害社區長久以來對警方的不信任。","poster":"","posterSource":""},{"id":"murder-she-wrote","name":"她寫的謀殺","english":"Murder, She Wrote","years":"1984–1996","seasons":"12 季","episodes":"264 集","genre":["犯罪","偵探","懸疑"],"theme":["心理","社會議題"],"synopsis":"推理小說家 Jessica Fletcher 居住在緬因州小鎮 Cabot Cove，原本過著寫作、訪友的生活，卻總在旅行、聚會或返鄉時意外捲入謀殺案。她沒有正式警察身分，卻能藉由細膩觀察、邏輯推理與對人性的理解，發現警方忽略的關鍵細節。每宗案件都藏有複雜的人際關係、財務糾紛或被刻意掩蓋的往事。Jessica 常在與嫌疑人交談的過程中尋找矛盾，讓看似不重要的言行成為破案線索。作品結合溫和幽默、古典推理與人物情感，是以智慧而非暴力推進故事的代表性偵探劇。她與當地居民維持長年友情，在案件發生後往往能從家庭習慣與社區往事找到警察沒有注意的線索。不同城市、職業與社會階層的嫌疑人為單元故事帶來變化，但 Jessica 始終以耐心觀察代替武力，凸顯推理與同理心可以共同發揮作用。一位善於傾聽的作家在警局外也能發揮偵查才能，這是劇情最大的魅力。小鎮居民各有隱藏往事，使表面平靜的鄰里生活充滿變數。","poster":"","posterSource":""},{"id":"nypd-blue","name":"紐約重案組","english":"NYPD Blue","years":"1993–2005","seasons":"12 季","episodes":"261 集","genre":["犯罪","警匪"],"theme":["職場","家庭","社會議題"],"synopsis":"故事聚焦紐約市警察局第十五分局的警探及其同事，從街頭命案、毒品案件到警局內部衝突，呈現高度寫實而充滿灰色地帶的警察生活。Andy Sipowicz 是劇中最具代表性的角色，脾氣暴躁、背負個人創傷，卻在長期合作與挫折中尋求改變。案件調查交織婚姻、酗酒、親子與職業倫理問題，人物經常必須面對自己造成的傷害。影集突破當時主流電視的表現尺度，以較粗礪的對白及強烈情緒刻畫執法人員，使警匪類型不再只是單純追逐兇手的程序故事。劇中角色並不是標準化的正義化身，而是會犯錯、會被偏見左右，也需要付出代價的普通人。警察工作的責任感往往和恐懼、憤怒與自我懷疑同時存在；這種寫實性與人物連續成長，讓觀眾更能理解警察體制內部的矛盾。長期輪班讓探員的婚姻與友誼都面臨考驗，有時他們只能依靠同事理解自己的處境。","poster":"","posterSource":""},{"id":"bones","name":"尋骨線索","english":"Bones","years":"2005–2017","seasons":"12 季","episodes":"246 集","genre":["犯罪","偵探","懸疑"],"theme":["職場","愛情","心理","家庭"],"synopsis":"法醫人類學家 Temperance Brennan 以骨骼鑑定與科學分析聞名，與重視直覺和人際互動的 FBI 探員 Seeley Booth 合作，破解只剩骸骨或高度腐敗遺體的命案。Jeffersonian 研究所專家團隊擅長昆蟲學、藝術復原、電腦技術及痕跡分析，協助還原被害者身分與死亡原因。嚴謹的科學方法和直覺式偵查經常互相碰撞，卻也讓兩位主角逐漸建立信任。除了每集的懸疑案件，故事持續發展同事友情、家庭關係及主角愛情，在幽默與黑暗題材之間取得平衡。兩名主角起初幾乎代表理性與情感的兩端，長期共事後才慢慢學會尊重對方的專長。研究室成員之間的玩笑、誤會與共同生活，也讓冰冷的遺骸成為重新理解逝者人生的入口，使案件推理與角色關係同步發展。遭到忽視的骨骸讓研究團隊有機會替死者重新說出故事。透過生前物件與身體痕跡，角色試圖重建其最後的行動。科學工作因而帶有關懷他人的意義。","poster":"","posterSource":""},{"id":"hawaii-five-0","name":"檀島警騎2.0","english":"Hawaii Five-0","years":"2010–2020","seasons":"10 季","episodes":"240 集","genre":["犯罪","警匪","動作"],"theme":["職場","友情","冒險"],"synopsis":"前海軍軍官 Steve McGarrett 回到夏威夷追查父親之死，受州長授權組建特別執法小組，與來自紐約的警探 Danny Williams、當地警員和其他專家合作。團隊面對幫派、人口販運、跨國罪犯及針對島嶼的重大威脅，行動範圍從都市街頭擴大到海上和偏遠地區。Steve 喜歡冒險、果斷出擊，Danny 則重視規則與家人，兩人的鬥嘴成為劇中固定特色。新版延續經典警匪設定，更加入高速追逐、科技犯罪與角色長線身世謎團，營造動作冒險與夥伴喜劇並重的節奏。團隊成員雖有特殊授權，仍必須面對執法界線與個人代價。旅遊天堂的外表掩蓋島上不同族群的社會問題，故事也運用傳統家庭觀念、朋友義氣與夥伴間的衝突，讓高強度動作戲之外仍保有情感連結。隊伍對家人保護的承諾往往和危險的任務彼此拉扯。當成員被迫在同袍與法律責任中選邊，他們的信任會受到考驗。夏威夷的社會背景則為案件增加獨特氛圍。","poster":"","posterSource":""},{"id":"csi-miami","name":"CSI 犯罪現場：邁阿密","english":"CSI: Miami","years":"2002–2012","seasons":"10 季","episodes":"232 集","genre":["犯罪","偵探","懸疑"],"theme":["職場","心理"],"synopsis":"邁阿密犯罪現場調查隊在 Horatio Caine 帶領下，以法醫鑑識、彈道分析、數位證據與現場重建追查命案。熱帶城市明亮的海岸、豪華住宅和夜生活場景，與案件中的暴力、貪婪及隱藏秘密形成對照。團隊面對的不只有一般殺人事件，也包括毒品交易、跨境犯罪及危及公共安全的陰謀。Horatio 以冷靜而堅定的方式保護受害者，成員則在各自的專業與私人經歷中逐步成長。影集將科學辦案與高度戲劇化的視覺風格結合，重點在於細小物證如何推翻精心設計的謊言。每宗案件常由一個意外發現的物證開始，逐步揭露受害者不為人知的生活。隊員彼此之間的專業信任，會在案件變得私人化或同僚身陷危險時受到考驗。作品以鮮明色彩和快速剪接突顯現代鑑識技術的戲劇效果。邁阿密繁忙的港口和國際往來使嫌疑人來源十分多元，案件牽涉的社會階層也相當廣泛。","poster":"","posterSource":""},{"id":"jag","name":"執法悍將","english":"JAG","years":"1995–2005","seasons":"10 季","episodes":"227 集","genre":["法律","犯罪"],"theme":["軍事","職場","政治"],"synopsis":"美國海軍軍法署軍官 Harmon Rabb 與 Sarah MacKenzie 負責處理軍人犯罪、軍事審判與涉及國家安全的法律爭議。案件可能是戰機事故、違反軍紀、間諜嫌疑，也可能發生在海外基地與作戰任務中。兩位主角一方面必須依法調查並在軍事法庭辯論，另一方面又深知軍人對命令、榮譽和同袍的責任。這些價值有時與程序正義產生衝突，讓案件不只是判斷有罪無罪。作品將法庭攻防、軍事冒險與逐漸發展的主角關係融合，也是後來《NCIS》系列的重要源頭。Rabb 曾是海軍飛行員，因此對事故與作戰任務有切身理解；Mac 則提供不同的法律專業與判斷視角。兩人的關係在競爭與信任中逐漸轉變，將嚴肅軍法與角色私生活結合，也讓軍中的榮譽觀與司法程序經常正面交鋒。軍方機構並非只有明確的命令，也存在對程序正義和指揮權的爭議。主角面對不同立場時需要保持專業。法庭內外的選擇都會影響軍人聲譽與家庭生活。","poster":"","posterSource":""},{"id":"the-blacklist","name":"黑名單","english":"The Blacklist","years":"2013–2023","seasons":"10 季","episodes":"218 集","genre":["犯罪","懸疑","動作"],"theme":["心理","政治","家庭"],"synopsis":"神祕的國際通緝犯 雷蒙德・雷丁頓 突然向 FBI 自首，表示願意提供一份政府尚未掌握的危險犯罪者名單，但堅持只與年輕探員 伊莉莎白・基恩 合作。FBI 因此成立特別小組，追捕隱藏在金融、情報、武器與犯罪網路中的重要人物。每次破案都揭露更龐大的陰謀，而 雷丁頓 為何選中 伊莉莎白、他的真實身分及與她家人的關係，也逐漸成為核心謎團。作品結合單集追捕、長線祕密與反英雄魅力，讓觀眾不斷思考合作夥伴究竟是保護者、操縱者，還是更危險的威脅。隨著追查深入，伊莉莎白 開始懷疑自己所知道的家族故事，雷丁頓 也一次次以危險交易換取更深的信任。觀眾必須從他的話語、盟友與敵人之間判斷真偽，而團隊成員對是否應與罪犯合作，始終無法形成完全一致的答案。真正令人不安的是，合作計畫有時可能只是更深一層的操縱。角色在獲得重要情報時，也必須警惕對方索取的代價。","poster":"","posterSource":""},{"id":"law-order-criminal-intent","name":"法律與秩序：犯罪傾向","english":"Law & Order: Criminal Intent","years":"2001–2011","seasons":"10 季","episodes":"195 集","genre":["犯罪","警匪","偵探"],"theme":["心理","職場"],"synopsis":"紐約重大案件組處理複雜謀殺與高知名度犯罪，與《法律與秩序》本傳相比，更重視嫌犯的心理、動機及與偵探之間的智力攻防。Robert Goren 擅長觀察情緒、肢體語言和細節，搭檔 Alexandra Eames 則以扎實的現場判斷與調查能力補足他的特殊方法。觀眾經常先看到犯罪者如何策劃行動，再跟著警探理解其心理漏洞。案件涉及權力人物、藝術圈、企業與家庭關係，也讓警探面對自己情緒和職涯上的壓力。敘事特色是犯罪者與調查者彼此試探，而非只靠物證突然揭曉答案。嫌疑人有時早已出現在觀眾視野中，懸念於是轉向偵探如何推翻對方編造的心理防線。劇情也凸顯詢問技巧與關係建立的重要性：Goren 看似天馬行空的談話，往往是刻意引導對手暴露個性與矛盾。偵探需要精確理解嫌疑人如何看待自己，才能找到能夠瓦解其偽裝的問題。案件當事人的社會地位往往使詢問更為困難。","poster":"","posterSource":""},{"id":"columbo","name":"神探可倫坡","english":"Columbo","years":"1968–2003（分期播出）","seasons":"10 季","episodes":"69 集","genre":["犯罪","偵探","懸疑"],"theme":["心理","社會議題"],"synopsis":"洛杉磯警探 Columbo 外表不起眼，總穿著皺巴巴的風衣，說話謙和、反覆追問細節，看似笨拙卻擁有驚人的觀察力。許多集數在開頭就讓觀眾看到兇手策劃並執行謀殺，因此真正的懸念並非誰是犯人，而是警探如何抓住對方的失誤。嫌犯經常是富有、聰明或具社會地位的人物，往往低估這名貌不驚人的警官。Columbo 透過日常談話、現場物件與時間線矛盾逐步逼近真相，最後以看似不經意的「還有一件事」提出致命問題，形成獨特的倒敘推理魅力。每集通常花費相當篇幅刻畫犯人的自信與精密布局，讓觀眾同時理解犯罪計畫和其中隱藏的漏洞。Columbo 的平凡外貌使對手放下戒心，他不急於炫耀推理能力，而是耐心蒐集能在最後一刻擊破說詞的細節。即使兇手早已現身，敘事仍透過心理交鋒維持緊張。警探的耐心與觀察顯得比追逐場面更加有力。觀眾也因此能主動檢視每個微小的時間線矛盾。","poster":"","posterSource":""},{"id":"greys-anatomy","name":"實習醫生","english":"Grey's Anatomy","years":"2005–至今","seasons":"23 季","episodes":"467 集","genre":["醫療"],"theme":["職場","愛情","友情","家庭"],"synopsis":"Meredith Grey 與一群年輕醫師進入西雅圖教學醫院，從毫無經驗的實習生逐漸成為必須獨當一面的外科專家。面對車禍、器官移植、罕見病症及突發大型事故，他們每天都要在有限資訊和巨大風險下選擇治療方式。醫院同時也是充滿權力、競爭與親密關係的職場，導師可能變成對手，戀人也可能成為同事。故事跨越不同世代的醫療團隊，描寫友情、婚姻、失去親友、育兒與職業倦怠。劇集藉由病患的人生困境映照醫師的選擇，讓醫學倫理和個人成長成為長期主題。醫院成員之間不只有競爭，也有師徒傳承與相互療癒。觀眾隨角色成長，會發現醫師即使擅長手術，仍可能不懂得處理悲傷與親密關係。從新人的第一天到成為帶領團隊的主管，責任感的意義也不斷改變。醫師在學會精湛技術之外，更難學的是如何向家屬表達無法改變的結果。每個病患都提醒角色重新思考人生。","poster":"https://pics.filmaffinity.com/Grey_s_Anatomy_TV_Series-461638569-large.jpg","posterSource":"https://www.filmaffinity.com/us/movieimage.php?imageId=461638569"},{"id":"er","name":"急診室的春天","english":"ER","years":"1994–2009","seasons":"15 季","episodes":"331 集","genre":["醫療"],"theme":["職場","社會議題"],"synopsis":"故事發生在芝加哥一所大型醫院的急診部門，急診醫師、住院醫師與護理人員每一天都必須處理連續湧入的危急病患。從重大外傷、兒科急症到突發傳染病，團隊需要迅速分工、判斷病況並面對無法挽回的生命損失。Mark Greene、Doug Ross、Carol Hathaway 等角色在高壓輪班中建立深厚情誼，卻也因職涯選擇、醫療錯誤與私人關係陷入困境。影集擅長以快速移動的鏡頭與多線敘事呈現急診室的混亂，並將醫院資源不均、社會弱勢與醫師的專業責任融入人物故事。急診室永遠無法事先安排下一位病患會是誰，角色常在救活某人後立刻面對另一場失敗。這種持續而快速的工作節奏，也讓人看見醫護人員在制度、資源和時間的夾縫中做決策的困難，以及團隊互信的重要。患者可能在一個夜班裡反覆經歷希望與失望，醫師必須迅速恢復專注才能繼續工作。團隊中的新人成長也不斷改變分工。","poster":"","posterSource":""},{"id":"chicago-med","name":"芝加哥醫情","english":"Chicago Med","years":"2015–至今","seasons":"12 季","episodes":"221 集","genre":["醫療"],"theme":["職場","社會議題"],"synopsis":"芝加哥 Gaffney 醫療中心的急診醫療團隊在繁忙的醫院裡處理危重病人、疑難雜症和大型事故。醫師、護理師、精神科專家及醫院管理者必須合作，卻不時因治療優先順序、病患自主權和醫療資源發生爭執。部分病例涉及病患隱瞞的家庭祕密、財務困難或心理創傷，讓單純的醫學判斷變成倫理難題。團隊成員也面臨升遷壓力、伴侶關係和私人失落，在專業承諾與個人幸福之間尋求平衡。影集與《Chicago Fire》《Chicago P.D.》共享世界觀，經常呈現跨部門救援與案件後續。醫院管理層需要考量成本與風險，第一線醫師則經常從病患角度堅持治療，雙方因此反覆出現分歧。病例之外，角色也必須學會如何向家屬解釋難以接受的消息，或在失敗後重新面對下一位需要幫助的人。不同專科之間的合作與分歧往往影響治療，病患卻未必能理解背後的專業權衡。角色需要向家屬解釋選擇，也必須接受自己不能控制所有結果。","poster":"","posterSource":""},{"id":"chicago-fire","name":"芝加哥烈焰","english":"Chicago Fire","years":"2012–至今","seasons":"15 季","episodes":"297 集","genre":["救援","動作"],"theme":["職場","友情"],"synopsis":"芝加哥消防局第五十一分隊的消防員、救護技術員與隊長每天面對建築火警、交通事故、危險物質外洩以及其他緊急救援。從警鈴響起到抵達現場，隊員必須彼此信任，因為任何一個錯誤都可能危及同袍與市民生命。劇情同時描寫消防站內部的階級、訓練、領導磨合和人員更替，展現英雄形象背後的疲憊、創傷與脆弱。主角們的愛情、友情和家庭關係常受到輪班與生死風險影響。作品強調第一線救援的團隊精神，也與芝加哥警察及醫療系列交織出城市的完整緊急應變網絡。救援過程看似仰賴個人的勇敢，其實更需要事前訓練、明確指揮與夥伴默契。角色會因突發失去同事而重新檢視自己的選擇，也在協助城市居民的過程中，逐漸理解不同社群所面臨的生活困境。建立起共同的使命感。即使救援成功，隊員仍可能因事故留下難以說出口的情緒。","poster":"","posterSource":""},{"id":"9-1-1","name":"火速救援最前線","english":"9-1-1","years":"2018–至今","seasons":"10 季","episodes":"143 集","genre":["救援","動作"],"theme":["職場","家庭","友情"],"synopsis":"以洛杉磯警察、消防員及緊急電話接線員的工作為核心，每集從一通看似普通或極端離奇的求救電話展開，涉及火災、自然災害、交通意外與家庭危機。消防站一一八分隊成員必須在混亂現場迅速判斷風險，接線員則透過電話陪伴求救者，甚至在看不到現場的情況下協助拯救生命。Athena、Bobby、Buck 等角色在工作之外各有婚姻、親子和心理上的挑戰。劇集將高概念的災難場面與溫暖的人際敘事並置，提醒觀眾危險過後仍需要面對創傷、責任及重新建立生活的過程。不同第一線人員未必會在同一場景相遇，但他們的決定會互相影響：接線員的指引可能決定現場部署，警察與醫療團隊也必須接手後續處置。角色們因此體認到，緊急救援既是一門技術，也是一種長期的人際承諾。從接通緊急電話到送醫治療，一次事故經常牽涉多個看不見的工作環節。","poster":"","posterSource":""},{"id":"scrubs","name":"實習醫生風雲","english":"Scrubs","years":"2001–2010；2026–至今","seasons":"10 季","episodes":"191 集","genre":["情境喜劇","醫療"],"theme":["職場","友情","成長"],"synopsis":"年輕醫師 J.D. 進入 Sacred Heart 醫院，與好友 Turk、同事 Elliot 及個性古怪的醫護團隊共同學習如何行醫。J.D. 經常以天馬行空的幻想呈現內心想法，讓高壓病房與荒謬的職場關係轉變成喜劇場景。看似胡鬧的故事卻常突然轉向嚴肅的生死議題，從病患死亡、醫療失誤到醫師無法承認自己的脆弱，都讓角色逐漸成熟。嚴格的 Cox 醫師既是 J.D. 的精神導師，也是最常批評他的人。多年後的回歸篇章再度讓老朋友在醫院重逢，呈現醫療制度與新人世代改變之下，友情和職業理想如何持續接受考驗。J.D. 的內心旁白讓觀眾接觸一名醫師在喜劇外表下的焦慮與自我懷疑，某些看似好笑的情節最後卻引向令人難忘的悲傷。這種情緒反差凸顯醫療工作真正的困難並非只有知識，而是與人相處及接受無能為力。醫院裡的荒謬笑話經常來自真實存在的上下級關係與職場壓力。當角色回到病床前，仍需認真面對每個生命。","poster":"","posterSource":""},{"id":"baywatch","name":"海灘遊俠","english":"Baywatch","years":"1989–2001","seasons":"11 季","episodes":"241 集","genre":["救援","動作"],"theme":["職場","愛情","友情"],"synopsis":"這部劇以洛杉磯海岸救生員為主角，後期舞台延伸至夏威夷。Mitch Buchannon 和團隊在繁忙的海灘巡邏，處理溺水、船隻事故、海洋生物威脅以及遊客造成的各種危險。救生員必須具備體能、急救能力與快速判斷，在保護市民的同時也可能冒著自身生命危險。不同隊員經歷家庭衝突、愛情起伏、職涯抉擇和競爭，讓故事從海上救援延伸到私人生活。作品以陽光海岸的視覺風格和動作冒險聞名，也呈現這份看似浪漫的工作背後所需的責任感、團隊配合與日常訓練。Mitch 常像導師般引導年輕救生員，提醒他們救人不能只靠衝動，也必須尊重海象與團隊規範。海灘上的臨時事件經常帶出青春成長、親子衝突與戀愛煩惱，形成兼具職場與家庭色彩的冒險故事。在陽光沙灘背後，救生員要承受高度疲勞與突發風險。新成員常因缺乏經驗而低估海況，資深隊員則不斷強調紀律。","poster":"","posterSource":""},{"id":"it-s-always-sunny-in-philadelphia","name":"酒吧五傑","english":"It's Always Sunny in Philadelphia","years":"2005–至今","seasons":"18 季","episodes":"187 集","genre":["情境喜劇"],"theme":["黑色幽默","職場","社會議題"],"synopsis":"五名自私、固執又缺乏自我反省能力的人，圍繞費城 Paddy's Pub 酒吧展開一連串失控計畫。Dennis、Dee、Mac、Charlie 和 Frank 經常為了賺錢、出名、證明自己或爭奪控制權而互相利用，結果總把簡單問題變成難以收拾的災難。角色幾乎不會從錯誤中學到教訓，也常以荒謬的方式挑戰社會規範。影集透過誇張的自我中心人格和黑色幽默，諷刺種族、階級、政治、宗教與流行文化。它不是傳統溫暖的友情喜劇，而是讓觀眾從這群人的失敗看見人性缺點與集體愚蠢。這群人的友誼往往建立在共同犯錯與彼此傷害之上，角色即使面對明顯後果也很少真正改變。正因如此，故事能不斷從身分焦慮、道德雙標及社交禮儀中創造意外笑點，讓觀眾反思什麼才是成熟的行為。觀眾看見這群人不斷重複自私行為，往往比他們自己更清楚問題所在。朋友間的競爭與嫉妒製造出持續的反差。故事不急於給出教訓，而讓荒謬後果自己說話。","poster":"","posterSource":""},{"id":"the-big-bang-theory","name":"宅男行不行","english":"The Big Bang Theory","years":"2007–2019","seasons":"12 季","episodes":"279 集","genre":["情境喜劇"],"theme":["友情","愛情","職場"],"synopsis":"李奧納德、謝爾頓、霍華德 和 拉傑 是擅長科學與科技、卻在人際互動上各有困難的朋友。住在公寓對面的 潘妮 加入他們的生活後，讓這群科學家的社交世界逐漸擴大。四人從漫畫、電玩、物理理論聊到戀愛與婚姻，往往因固執、嫉妒或過度理性而鬧出笑話。隨著 艾咪、柏娜黛特 等角色加入，故事也逐漸從單身室友生活轉向伴侶關係、家庭規劃與學術職涯。影集以科學術語和流行文化建立獨特的喜劇節奏，也讓觀眾見證一群原本不擅表達感情的人，如何學會關心與接納彼此。謝爾頓 對秩序的要求常成為朋友的困擾，但他也在友情和戀愛中逐漸接觸陌生情感；潘妮 則發現自己同樣能在這個群體裡找到支持。角色的成長雖然伴隨無數荒謬爭執，卻使科學與人性不再彼此排斥。科學家在專業領域的高度自信，與日常交往的不知所措形成鮮明對照。","poster":"https://flxt.tmsimg.com/assets/p185554_b_v8_bk.jpg","posterSource":"https://www.rottentomatoes.com/tv/The_big_bang_theory"},{"id":"two-and-a-half-men","name":"男人兩個半","english":"Two and a Half Men","years":"2003–2015","seasons":"12 季","episodes":"262 集","genre":["情境喜劇"],"theme":["家庭","愛情","黑色幽默"],"synopsis":"富有又愛享樂的廣告作曲家 Charlie 過著自在的單身生活，直到離婚的弟弟 Alan 帶著兒子 Jake 搬進他的海濱住宅。三人性格完全不同：Charlie 逃避承諾、Alan 焦慮又節省、Jake 則以孩童視角看待大人的荒唐世界。家庭生活充滿約會失敗、金錢爭執、親子管教與兄弟競爭，母親 Evelyn 偶爾出現更讓衝突升級。隨著人物更替，房子仍是不同個性角色互相碰撞的核心空間。劇集以尖銳對白和成人幽默描寫不完美的家庭，也反覆探討成熟、責任與親密關係的矛盾。Alan 與 Charlie 雖常因金錢和生活方式爭吵，仍因共同的家庭歷史無法完全切斷關係。隨著 Jake 長大，成人角色也被迫思考自己對孩子的影響。故事以不斷升級的生活失序，反諷成年人的不成熟。角色們明知生活安排並不合理，卻經常因害怕改變而維持原狀。父親對孩子的影響成為重要的笑點來源。兄弟之間的依賴也讓故事有了更深的家庭層次。","poster":"","posterSource":""},{"id":"frasier","name":"歡樂一家親","english":"Frasier","years":"1993–2004","seasons":"11 季","episodes":"264 集","genre":["情境喜劇"],"theme":["家庭","職場","愛情"],"synopsis":"精神科醫師 Frasier Crane 返回西雅圖，主持廣播心理諮詢節目，原本以為可以重新開始優雅的單身生活，卻與個性直接的退休警察父親 Martin 同住。高傲又講究品味的弟弟 Niles、父親的照護員 Daphne 與電台同事 Roz，也不斷捲入兄弟倆精心安排卻經常失敗的計畫。Frasier 擅長分析他人的感情，面對自己的戀愛與家人時卻常犯下荒謬錯誤。劇集以語言機鋒、階級品味差異與家庭誤會為笑點，長線則描寫父子和兄弟從互相看不順眼到學會理解彼此的過程。兩兄弟試圖以歌劇、葡萄酒和藝術品區分自己與普通人，最後卻常被生活最基本的需求打敗。Martin 的務實與 Daphne 的直率不斷挑戰他們的自尊，也使故事從階級喜劇逐步轉向家庭理解與情感成熟。高雅的社交規範與日常生活的不確定性不斷發生碰撞，讓主角的自尊成為最大笑點。父親對兩個兒子的關心較少直接表達。家庭成員卻在長期相處中逐漸了解彼此。","poster":"","posterSource":""},{"id":"murphy-brown","name":"墨菲布朗","english":"Murphy Brown","years":"1988–1998；2018","seasons":"11 季","episodes":"260 集","genre":["情境喜劇"],"theme":["職場","政治","社會議題","家庭"],"synopsis":"資深電視新聞主播 Murphy Brown 聰明、強勢、工作能力出色，卻在高度競爭的媒體環境中常與同事和上司發生衝突。她所在的新聞節目團隊需要面對政治新聞、收視率、製作壓力以及新聞倫理，也經常對美國社會議題提出尖銳諷刺。Murphy 的私人生活同樣不平靜，尤其在成為單親母親後，如何分配工作與育兒時間成為重要主題。透過固定的新聞編輯室角色群像，作品描寫女性在職場中的野心和脆弱，並以幽默方式質疑媒體文化、傳統家庭期待與公眾人物的虛偽。新聞室既是職業舞台也是同事彼此扶持的社群。Murphy 的尖銳評論讓她成為敢於質疑權威的人物，卻也使人際關係更加困難。故事透過她的選擇，探索女性能否不必迎合社會期待而追求自己認同的人生。新聞工作需要敏銳判斷，但 Murphy 也經常把這份強勢帶進私人生活。朋友與同事為她提供不同觀點。","poster":"","posterSource":""},{"id":"married-with-children","name":"奉子成婚","english":"Married... with Children","years":"1987–1997","seasons":"11 季","episodes":"259 集","genre":["情境喜劇"],"theme":["家庭","黑色幽默","社會議題"],"synopsis":"鞋店店員 Al Bundy 對工作、婚姻與人生充滿抱怨，妻子 Peggy 喜愛消費和休閒，兒女 Kelly、Bud 也各有自私又荒謬的性格。這個家庭沒有傳統情境喜劇的完美親情，成員常互相挖苦、逃避責任，或試圖以投機取巧改善處境。與鄰居的互動又讓日常的小衝突變得更難收拾。故事透過低收入家庭的挫敗、男性自尊、消費慾望及婚姻不滿製造誇張笑料，反轉電視上常見的理想家庭圖像。雖然角色經常口出惡言，卻也在某些危機時刻表現出難以割捨的家庭連結。角色對金錢、外貌與性別角色的抱怨具有刻意誇大的諷刺意味，劇情也經常讓每個人為自私選擇付出代價。它的喜劇效果來自家庭成員拒絕扮演理想父母或子女，卻又難以真正離開彼此。展現了反英雄式家庭幽默。角色在失敗後不一定反省，往往反而把責任推給其他家人。這種互相挖苦使家庭充滿荒謬張力。","poster":"","posterSource":""},{"id":"modern-family","name":"摩登家庭","english":"Modern Family","years":"2009–2020","seasons":"11 季","episodes":"250 集","genre":["情境喜劇"],"theme":["家庭","愛情","成長"],"synopsis":"以假紀錄片風格跟拍三個彼此有親屬關係、家庭形式卻截然不同的家庭：Jay 與年輕妻子 Gloria 的重組家庭、Claire 和 Phil 的五口之家，以及 Mitchell、Cameron 的同志家庭。每集透過訪談與生活現場交錯呈現孩子教育、夫妻摩擦、兄弟姊妹競爭和世代觀念差異。人物常因想證明自己是好父母或好伴侶而做出笨拙選擇，最後卻在混亂中重新理解對方。作品不把家庭定義成單一模樣，而是用幽默與溫情描寫不同個性的人如何在長期相處中形成共同生活的默契。角色之間常因害怕被批評，而試圖掩飾自己脆弱或不完美的一面；訪談鏡頭則揭露他們真正的想法。隨著孩子長大、父母逐漸老去，家庭成員對幸福與成功的想像也不斷調整，留下細膩的情感變化。孩子們對父母的反抗往往來自渴望被理解，父母卻容易誤認成不聽話。訪談鏡頭揭露角色說不出口的想法。每個家庭都必須學習尊重差異。","poster":"https://cdn1.clickthecity.com/images/tv/poster/600/1774.jpg","posterSource":"https://www.clickthecity.com/tv/series/4c2401/modern-family"},{"id":"will-grace","name":"威爾與葛蕾絲","english":"Will & Grace","years":"1998–2006；2017–2020","seasons":"11 季","episodes":"246 集","genre":["情境喜劇"],"theme":["友情","愛情","社會議題"],"synopsis":"住在紐約的律師 Will 與室內設計師 Grace 是親密好友，雖然兩人有不同的戀愛取向和性格，卻長期依賴彼此，在工作、感情和人生低潮時互相扶持。華麗又自我中心的 Jack、毒舌富有的 Karen，則帶來另一組充滿反差的朋友互動。劇集從室友與友情的親密關係切入，描寫約會、分手、婚姻、家庭期待與個人成長，並以快速的語言笑料反映美國都會文化。人物偶爾因太習慣彼此而忽略對方真正的需要，讓友情與獨立之間的界線成為重要主題。Will 和 Grace 長年熟悉彼此，這份親近有時成為支持，也可能阻礙各自建立新的關係。Jack 與 Karen 雖常以刻薄笑話掩飾情緒，關鍵時刻卻展現對朋友的忠誠。劇集把幽默與身分認同連結，呈現都會友情的各種可能。朋友們在彼此失戀或職涯受挫時提供陪伴，也可能因太過熟悉而越過界線。喜劇笑點來自角色對關係的不同期待。長期的相處讓這份友情更有重量。","poster":"","posterSource":""},{"id":"friends","name":"六人行","english":"Friends","years":"1994–2004","seasons":"10 季","episodes":"236 集","genre":["情境喜劇"],"theme":["友情","愛情","職場"],"synopsis":"瑞秋、莫妮卡、菲比、喬伊、錢德勒 和 羅斯 六名年輕人在紐約曼哈頓生活，常在咖啡館 Central Perk 或彼此公寓聚會。從事不同職業的他們經歷求職、失業、戀愛、分手、結婚和生育，並在各種尷尬時刻互相陪伴。羅斯 與 瑞秋 的感情起伏、莫妮卡 與 錢德勒 的關係，以及其他角色對未來的不同追求，構成長線故事。影集以生活化的對話、固定場景與角色默契呈現都市青年從二十多歲走向成熟的過程。六人的個性差異經常製造笑話，也證明友誼可以成為遠離家鄉的人們最重要的情感支持。六人常在工作失敗或感情受挫後回到同一張沙發聊天，形成超越血緣的家庭感。故事沒有單一英雄，而是靠群像之間的互動推進；即使角色各有任性、自卑與缺點，仍會陪伴朋友做出重大人生選擇。六人對於成功、婚姻與家庭的想像各不相同，人生進度也從來不一致。彼此之間的小習慣總能引發笑點。","poster":"https://image.tmdb.org/t/p/original/abmbzIOIVhOUBFyHcJuWnXl9OpU.jpg","posterSource":"https://www.themoviedb.org/tv/1668-friends/images/posters"},{"id":"roseanne","name":"蘿珊家庭生活","english":"Roseanne","years":"1988–1997；2018","seasons":"10 季","episodes":"231 集","genre":["情境喜劇"],"theme":["家庭","職場","社會議題"],"synopsis":"Roseanne Conner 與丈夫 Dan 在伊利諾州的小鎮撫養孩子，努力以有限收入支付帳單、維持工作並面對家庭的不確定性。與許多電視上光鮮亮麗的家庭不同，Conner 一家會為金錢爭吵、擔心失業，也會因親子教育、婚姻與健康問題承受壓力。Roseanne 以強硬、直率又犀利的幽默保護家人，卻也常因固執讓衝突加劇。劇集聚焦勞工階級的生活經驗，反映社會價值與家庭形式的變化。即使爭吵頻繁，家人仍在危機中互相照顧，形成帶有粗糙真實感的家庭喜劇。家庭問題不會因一次坦白就完全解決，經濟壓力與新困難總會再次出現。Roseanne 常以玩笑掩蓋焦慮，Dan 則試圖在現實限制中守住尊嚴。這份貼近一般家庭的粗獷溫暖，使角色不像完美範本而更像真實的人。家庭成員習慣在餐桌上爭吵，也在困難時刻重新團結。角色對經濟現實的抱怨帶著幽默。這些難題讓故事更能反映一般家庭的生活壓力。","poster":"","posterSource":""},{"id":"the-goldbergs","name":"戈德堡一家","english":"The Goldbergs","years":"2013–2023","seasons":"10 季","episodes":"229 集","genre":["情境喜劇"],"theme":["家庭","成長","友情"],"synopsis":"故事設定在一九八○年代的美國郊區，少年 Adam Goldberg 喜歡用攝影機記錄家庭生活，也熱愛電玩、電影及當時的流行文化。他的母親 Beverly 過度保護孩子，父親 Murray 習慣用粗魯卻真誠的方式表達關心，哥哥姊姊則經歷友情、校園和愛情的煩惱。Adam 的成長視角讓日常小事充滿誇張想像，也帶出家人對自由與責任的不同看法。影集以真實創作者的童年回憶為靈感，結合懷舊物件、音樂和家庭笑料，展現即使每個人表達愛的方式不同，家人仍會在混亂中彼此支持。Adam 的記憶常把平凡小事變成一場史詩級冒險，但家人的愛與尷尬仍是共同核心。兄弟姊妹一邊爭奪關注，一邊學會為對方挺身而出。劇中對八○年代文化的引用也為家庭成長故事增添時間感。流行文化的記憶提供笑料，但家庭角色的真實情緒才是故事核心。Adam 經常把事情看得過於戲劇化。成長後，他也開始理解父母當年的難處。","poster":"","posterSource":""},{"id":"curb-your-enthusiasm","name":"人生如戲","english":"Curb Your Enthusiasm","years":"2000–2024","seasons":"12 季","episodes":"120 集","genre":["情境喜劇"],"theme":["黑色幽默","社會議題"],"synopsis":"《歡樂單身派對》創作者 Larry David 在劇中飾演自己誇張化的版本，已經擁有財富與事業成功，卻總在日常人際禮儀上與所有人發生衝突。從餐廳訂位、停車習慣、朋友聚會到慈善活動，Larry 對不合理規則的執著和毫不妥協的坦率，常讓小誤會一路擴大。配角們各有敏感點，沒有人能完全避開他的冒犯。影集以即興感很強的對話和層層堆疊的尷尬情境建立笑點，讓觀眾在同情與厭煩主角之間擺盪。它也透過微小社交衝突，諷刺名流文化、社會規範及人們對公平的矛盾期待。Larry 經常認為自己只是在指出別人不願承認的問題，卻沒察覺自己的行為同樣缺乏同理心。隨著一連串小決定彼此牽連，尷尬逐步累積到荒謬結局，讓觀眾思考社交規則究竟保護了誰。一個微不足道的社交失誤可能牽連整場聚會，主角卻固執地認為自己毫無過錯。朋友的忍耐也有極限。","poster":"","posterSource":""},{"id":"tyler-perry-s-house-of-payne","name":"培恩一家","english":"Tyler Perry's House of Payne","years":"2006–2012；2020–至今","seasons":"14 季","episodes":"399 集","genre":["情境喜劇"],"theme":["家庭","社會議題","成長"],"synopsis":"已退休的消防隊長 Curtis Payne 與妻子 Ella 是家庭的核心人物，兩人經常為成年子女、孫子女和親戚處理生活難題。Curtis 個性固執、說話誇張，Ella 則更重視信仰、包容與家庭團結，夫妻相處充滿摩擦與幽默。不同世代角色面對育兒、婚姻、就業、經濟壓力和人際衝突，有時還必須處理成癮或其他嚴肅問題。故事以家庭客廳與鄰里生活為舞台，將吵鬧喜劇和較溫情的情節交替安排。即使家庭成員彼此不認同，也會在困難時提供支持，凸顯延伸家庭的力量與責任。Curtis 的嚴厲與 Ella 的溫柔代表不同的家庭溝通方式，孩子們則經常挑戰父母的傳統價值。劇集不以理想家庭為前提，而是讓角色在犯錯、爭吵和重新承諾中，理解照顧彼此的現實重量。不同世代對家庭責任的理解有落差，角色必須在親密關係中學會妥協。社區生活提供許多幽默場景。信任有時比一時的爭論輸贏更重要。","poster":"","posterSource":""},{"id":"7th-heaven","name":"第七天堂","english":"7th Heaven","years":"1996–2007","seasons":"11 季","episodes":"243 集","genre":["家庭劇"],"theme":["家庭","成長","社會議題"],"synopsis":"基督教牧師 Eric Camden 與妻子 Annie 在加州撫養多名子女，每個孩子都有不同的性格與成長煩惱。從學校壓力、第一次戀愛、同儕衝突到家庭責任，Camden 一家不斷遇到需要溝通與妥協的問題。父母希望透過信仰和道德原則引導孩子，卻逐漸發現單靠規定無法取代傾聽。隨著子女進入成年，劇情也加入婚姻、工作、育兒及獨立生活等新挑戰。故事經常關注青少年面對的社會議題，以家庭討論和情感支持作為化解衝突的重要方式，呈現不同世代對價值觀的碰撞與理解。父母並非總有正確答案，子女也不一定願意接受家庭的道德立場。當角色遇到新的社會觀念或人生選擇，家庭必須重新討論什麼才是支持。這種反覆溝通的過程，使作品呈現宗教家庭裡溫暖與矛盾並存的一面。子女漸漸長大後，父母必須接受自己的價值觀未必適用所有情境。家庭成員在衝突中尋求理解。","poster":"","posterSource":""},{"id":"beverly-hills-90210","name":"飛越比佛利","english":"Beverly Hills, 90210","years":"1990–2000","seasons":"10 季","episodes":"293 集","genre":["青春劇","都會劇"],"theme":["友情","愛情","成長"],"synopsis":"明尼蘇達州的 Walsh 兄妹 Brandon 與 Brenda 隨家人搬到洛杉磯富裕的比佛利山莊，進入與原本生活截然不同的高中環境。他們結識一群家境優渥、性格鮮明的朋友，共同經歷友情、競爭、戀愛與家庭期待。劇情從校園生活延伸到大學及成年初期，涉及身分認同、性別關係、家庭問題、成癮和未來職涯選擇。角色並非一直維持同樣的友誼與戀愛關係，隨著成長也不斷面臨背叛與重新和解。這部青春群像劇透過奢華都市背景與真實成長困境的反差，成為九○年代美國青少年影集的重要代表。角色在青春期形成的友情，到了成人世界還必須面對競爭、距離與價值觀的改變。表面富裕的家庭也可能充滿忽視與孤獨，讓故事在浪漫生活與情緒困境之間取得對照，拓展了青少年電視劇的敘事深度。表面上的社交光環經常掩飾少年對自我價值的焦慮。朋友之間的選擇既可能彼此支持，也可能造成傷害。","poster":"","posterSource":""},{"id":"shameless","name":"無恥之徒（美版）","english":"Shameless","years":"2011–2021","seasons":"11 季","episodes":"134 集","genre":["家庭劇"],"theme":["家庭","黑色幽默","社會議題"],"synopsis":"芝加哥南區的 Gallagher 家庭長期生活在貧困與混亂之中，父親 Frank 不負責任又沉迷酒精，長女 Fiona 因此必須提早擔起照顧弟妹的責任。每名孩子都想透過學業、工作、愛情或投機機會離開困境，卻常被家庭責任和自身缺點拉回現實。故事包含失業、債務、醫療、成癮與社會制度的矛盾，也不迴避性、犯罪與道德灰色地帶。即使家人彼此爭吵、撒謊甚至傷害對方，仍難以切斷情感連結。影集以尖銳黑色幽默描寫勞工階級的生存困境，讓荒謬喜劇與沉重現實不斷交錯。每個孩子試圖逃脫家庭困境的方式都不同，有人選擇照顧他人，有人則複製父親的破壞行為。影集不輕易將貧窮浪漫化，也不把人物當作單純的受害者，而是讓他們在荒謬失敗中不斷尋找尊嚴與自由。貧窮讓許多角色難以擁有選擇自由，家庭成員也因此不斷尋找短暫的生存策略。失敗雖然經常出現，他們仍試圖重建生活。","poster":"","posterSource":""},{"id":"tyler-perry-s-sistas","name":"姊妹心事","english":"Tyler Perry's Sistas","years":"2019–至今","seasons":"10 季","episodes":"215 集","genre":["都會劇"],"theme":["友情","愛情","職場"],"synopsis":"Andi、Karen、Danni 和 Sabrina 是一群在現代都市中生活的黑人單身女性，各自擁有不同的職業、個性與情感期待。她們在工作上努力尋求成就，感情生活卻經常牽涉不信任、複雜的舊關係、承諾落差與自我價值的拉扯。朋友們常在聚會中討論戀愛困境，互相提出建議，卻也因判斷不同而起衝突。故事延伸至伴侶、前任、家庭與同事，讓友情支持與個人獨立成為重要主線。作品關注社群媒體、現代約會文化及社會對女性的期待，呈現人在追求愛情與事業時如何界定尊重、界線與真正的幸福。四名女性對感情的標準並不相同，因此朋友的建議可能帶來力量，也可能引發新的誤解。她們必須在個人界線與維護關係之間做決定。影集藉由多條交錯的生活主線，描述現代都會女性如何共同成長。朋友可能勇於替彼此發聲，卻不總能在自己的感情中採取相同標準。職涯抉擇也影響她們對未來的想像。","poster":"","posterSource":""},{"id":"when-calls-the-heart","name":"傾聽心靈","english":"When Calls the Heart","years":"2014–至今","seasons":"13 季","episodes":"138（不含特別篇） 集","genre":["歷史劇"],"theme":["愛情","家庭","成長"],"synopsis":"出身富裕家庭的年輕教師 Elizabeth Thatcher 前往加拿大西部的小型礦業社區任教，遠離原本熟悉的舒適生活。她逐漸認識礦工家庭、地方居民與執法人員，發現社區雖然資源有限，卻有深厚的互助情誼。當意外、疾病、商業變動或家人離散衝擊居民，大家必須重新思考信任、勇氣和未來生活。Elizabeth 在教導孩子的過程中也學會適應新環境，並經歷愛情、失落與養育子女的挑戰。故事以二十世紀初的拓荒背景、浪漫情節與溫暖的社區群像為特色，強調希望與共同成長。小鎮居民面對危機時會展現互助，卻也有不同的利益、過去傷痛與人生選擇。Elizabeth 的教學生涯讓她逐漸認識每個家庭的處境，學會在堅持原則的同時理解他人，為歷史背景下的愛情故事增添生活厚度。Elizabeth 與鎮民共同面對產業變化和家庭失落，逐漸建立起真正的歸屬感。浪漫關係不再只是個人選擇，也會影響社區。","poster":"","posterSource":""},{"id":"supernatural","name":"超自然檔案","english":"Supernatural","years":"2005–2020","seasons":"15 季","episodes":"327 集","genre":["奇幻","恐怖","動作"],"theme":["超自然","家庭","冒險"],"synopsis":"兄弟 Sam 與 Dean Winchester 自幼受到父親訓練，駕車走遍美國各地，調查傳說中的惡靈、惡魔、吸血鬼與神祕死亡事件。兩人起初像流浪獵人般逐件處理超自然危機，後來卻發現自身家族與更龐大的天使、地獄及末日預言密切相關。兄弟對命運與自由意志有不同理解，也多次因保護對方而付出巨大代價。故事融合都市傳說、宗教神話、恐怖與黑色幽默，並讓反覆出現的盟友和敵人成為重要人物。整部劇的核心始終是兄弟關係：當世界與家人無法同時獲救時，他們究竟會選擇哪一方。兩兄弟的個性分歧讓他們在追捕怪物時常有衝突：一人渴望穩定生活，另一人習慣以犧牲保護家人。隨著天界與地獄勢力不斷介入，角色必須反覆確認自己究竟相信命運安排，還是能主動改寫未來。兄弟面對世界危機時最難放下的往往是對彼此的責任。每次重逢都可能伴隨新的代價。","poster":"","posterSource":""},{"id":"the-x-files","name":"X 檔案","english":"The X-Files","years":"1993–2002；2016–2018","seasons":"11 季","episodes":"218 集","genre":["科幻","懸疑","恐怖"],"theme":["超自然","職場","政治","家庭"],"synopsis":"FBI 探員 Fox Mulder 堅信外星人與超自然現象真實存在，理性而受過醫學訓練的搭檔 Dana Scully 則以科學方法檢驗每一宗離奇案件。兩人調查政府封存的「X 檔案」，從怪物傳說、人體異變到不明飛行物和神祕失蹤事件，逐步觸及牽涉情報機關與外星陰謀的巨大秘密。Mulder 尋找失蹤妹妹的執念與 Scully 對證據的堅持，使搭檔關係充滿矛盾又逐漸深化。影集一方面以獨立案件營造恐怖和懸疑，另一方面持續追問政府是否掩蓋真相，以及人在未知面前如何維持信念。每一集的怪異現象都可能有合理解釋，也可能顯示科學尚未理解的世界。Mulder 和 Scully 從互相懷疑逐步形成深厚信任，讓理性與信念的對話成為系列支柱。這種曖昧性使真相始終難以完全掌握。未知事件不斷挑戰兩人的信念，也讓他們學會理解對方的調查方法。政府機構的沉默往往比怪物更令人不安。觀眾因此始終在懷疑與信任之間游移。","poster":"https://fueradeseries.com/wp-content/uploads/2021/03/expediente-x-scaled.jpg","posterSource":"https://fueradeseries.com/series/expediente-x/"},{"id":"smallville","name":"超人前傳","english":"Smallville","years":"2001–2011","seasons":"10 季","episodes":"218 集","genre":["科幻","超級英雄"],"theme":["成長","家庭","愛情"],"synopsis":"少年 克拉克 Kent 在堪薩斯州小鎮 Smallville 長大，看似普通的農家男孩，卻因逐漸覺醒的超能力和不明身世感到困惑。他與父母、好友 克蘿伊、青梅竹馬 拉娜，以及日後的重要人物 雷克斯 Luthor 建立複雜關係。隨著異常事件頻繁發生，克拉克 必須學習控制能力、保護身邊的人，同時隱藏自己來自外星的秘密。朋友與敵人的界線逐漸改變，雷克斯 對權力和真相的執著也影響兩人命運。故事從高中青春劇發展成超級英雄起源史，描寫一個年輕人如何在愛情、友情與責任的拉扯中形成自己的道德信念。克拉克 的養父母不斷提醒他，能力不代表可以凌駕他人；這些教導成為他未來英雄身分的基礎。故事將青春迷惘與拯救世界的責任並置，使超人的傳奇更像一段從普通少年成長為守護者的漫長過程。超能力讓 Clark 能拯救朋友，卻也使他難以坦誠分享自己的生活。","poster":"","posterSource":""},{"id":"american-horror-story","name":"美國恐怖故事","english":"American Horror Story","years":"2011–至今","seasons":"13 季","episodes":"144（截至10月22日） 集","genre":["恐怖","懸疑"],"theme":["超自然","心理","社會議題"],"synopsis":"這部恐怖詩選影集通常每一季以新的舞台、人物與主題講述獨立故事，場景包括鬧鬼的房屋、精神病院、女巫集會、怪誕馬戲團、旅館和末日世界。角色可能遭遇幽靈、邪教、連續殺人犯、超自然詛咒或人性中難以理解的殘酷。雖然演員經常跨季回歸，扮演的卻可能是完全不同的人物，部分季度又以彩蛋或跨季連結擴展共同世界觀。作品重視視覺風格與心理不安感，常將美國歷史、社會偏見、性別與權力議題轉化為恐怖寓言。觀眾每季都會面對新的謎團，而非追隨同一群主角。各季主題常對應社會集體恐懼，例如家庭崩解、失去身分、權威濫用或被群體排斥。人物通常懷有難以承認的慾望與過往創傷，使恐怖並不只來自未知怪物，也可能源於自身選擇與制度性暴力。並帶出對美國文化的批判。不同季的恐怖來源雖不相同，角色對權力與愛的渴望卻經常構成悲劇。","poster":"","posterSource":""},{"id":"stargate-sg-1","name":"星際之門：SG-1","english":"Stargate SG-1","years":"1997–2007","seasons":"10 季","episodes":"214 集","genre":["科幻","動作"],"theme":["冒險","軍事","友情"],"synopsis":"美國空軍掌握一座能開啟跨星球通道的古代裝置「星際之門」，SG-1 探索小組因此前往不同文明與未知世界，與外星盟友接觸並抵抗強大的敵對勢力。由 Jack O'Neill、Daniel Jackson、Samantha Carter 及 Teal'c 等成員組成的隊伍，必須同時運用軍事策略、語言學、考古和科學研究解決危機。旅途中，他們發現某些古老神祇傳說與外星種族有關，也逐漸揭開宇宙政治與科技競賽的全貌。劇集結合單集冒險和跨季戰爭主線，強調不同文化之間的誤解、選擇與合作，並探討擁有強大科技是否等於擁有正當權力。小組探索異星時除了迎戰敵軍，也須考量是否該介入陌生文明的內部問題，甚至質疑地球人的行為是否同樣傲慢。角色的專長和價值觀彼此補足，讓宇宙冒險不只是武器競賽，也是跨文化理解的過程。探索未知文明使 SG-1 成員必須反省自己對科技與文化的假設。某些外星盟友也有隱藏動機。","poster":"","posterSource":""},{"id":"the-walking-dead","name":"陰屍路","english":"The Walking Dead","years":"2010–2022","seasons":"11 季","episodes":"177 集","genre":["恐怖","動作"],"theme":["末日生存","家庭","社會議題"],"synopsis":"警長 Rick Grimes 在昏迷後醒來，發現世界已被活屍疫情摧毀，城市失去秩序，倖存者只能在物資匱乏和隨時可能遭攻擊的環境中求生。他尋找家人並與其他倖存者組成隊伍，逐漸建立新的社群。隨著時間推進，人類群體之間的資源衝突、權力競爭和暴力威脅，往往比活屍本身更加可怕。角色必須在保護同伴、遵守道德與為生存採取極端行動之間做抉擇。故事從公路逃亡延伸到社區建設與戰爭，透過不斷失去、分裂和重聚，追問文明崩潰之後人們究竟還能保留多少人性。重要角色會因疾病、敵對勢力與團體內部的決策而離世，迫使倖存者重新評估自己願意守護的價值。劇集逐步將問題從「如何躲開活屍」轉成「如何共同生活」，使生存恐怖帶有強烈的政治與倫理色彩。即使找到相對安全的居所，倖存者仍需討論誰能制定規則。權力鬥爭和資源分配使小型社區充滿張力。","poster":"https://www.impawards.com/tv/posters/walking_dead_ver38_xlg.jpg","posterSource":"https://www.impawards.com/tv/walking_dead_ver38_xlg.html"},{"id":"power-rangers","name":"金剛戰士（系列）","english":"Power Rangers","years":"1993–2023","seasons":"30 季","episodes":"974 集","genre":["科幻","動作","超級英雄"],"theme":["友情","成長","冒險"],"synopsis":"不同世代的青少年被選中成為擁有特殊能力的戰士，透過變身裝備與機器人對抗威脅地球的怪物、外星軍團或邪惡組織。每一個篇章通常有自己的隊伍、變身主題與敵人設定，主角需要學會團隊合作、相信夥伴並承擔守護世界的責任。戰鬥之外，角色也會面對校園生活、家庭期待、嫉妒、挫敗與友誼考驗。劇集以鮮明的英雄形象、動作場面與巨大機器人戰鬥聞名，並透過新世代接續使命的方式延續世界觀。這裡統計的是以《Power Rangers》為共同品牌、不同副標題接續播出的整體真人特攝系列。不同世代戰士的故事常以新的敵人或能量系統重新開始，因此整體更接近同一品牌下的連續系列，而非始終跟隨同一組主角。它將青少年成長、團隊責任和幻想冒險結合，構成鮮明而長壽的兒童動作劇傳統。主角們的任務不只在戰勝敵人，也在學習接受不同個性的隊員。","poster":"","posterSource":"","posterQuery":"Mighty Morphin Power Rangers"}];

   const btn=make('button','chip',tag);btn.type='button';btn.dataset.tag=tag;btn.setAttribute('aria-pressed',String(selected.has(tag)));
   btn.addEventListener('click',()=>{selected.has(tag)?selected.delete(tag):selected.add(tag);renderChips();renderList()});wrap.appendChild(btn)
  }
 }
}
function isMatch(s){const chosen=[...selected];const own=[...s.genre,...s.theme];if(chosen.length && !(mode==='and'?chosen.every(t=>own.includes(t)):chosen.some(t=>own.includes(t))))return false;if(onlySaved&&!saved.has(s.id))return false;return true}
function syncButtons(){document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));$('watch-filter').setAttribute('aria-pressed',String(onlySaved));$('saved-count').textContent=String(saved.size)}

// Posters for the demo entries use their existing links; other show posters are resolved
// only when the row enters the viewport. TVmaze permits public show lookup.
const posterPromises=new Map();
const posterJobs=[];
let processingPosters=false;
async function drainPosterJobs(){
 if(processingPosters)return;
 processingPosters=true;
 while(posterJobs.length){
  const item=posterJobs.shift();let url='';
  try{
   const response=await fetch('https://api.tvmaze.com/singlesearch/shows?q='+encodeURIComponent(item.show.posterQuery||item.show.english));
   if(response.ok){const result=await response.json();url=result?.image?.medium||result?.image?.original||''}
  }catch(_error){}
  if(!/^https:\/\//.test(url))url='';
  item.resolve(url);
  if(posterJobs.length)await new Promise(resolve=>setTimeout(resolve,650));
 }
 processingPosters=false;
}
function fetchPoster(s){
 if(s.poster)return Promise.resolve(s.poster);
 if(!posterPromises.has(s.id)){
  posterPromises.set(s.id,new Promise(resolve=>{posterJobs.push({show:s,resolve});drainPosterJobs()}));
 }
 return posterPromises.get(s.id);
}
const posterObserver=('IntersectionObserver' in window)?new IntersectionObserver(items=>{
 for(const item of items){if(item.isIntersecting){posterObserver.unobserve(item.target);item.target.__fetchPoster?.()}}
},{rootMargin:'280px'}):null;
function setPoster(s,img,container){
 img.style.visibility='hidden';
 img.onload=()=>{img.style.visibility='visible'};
 img.onerror=()=>{img.style.display='none'};
 if(s.poster){img.src=s.poster;return}
 container.__fetchPoster=()=>fetchPoster(s).then(url=>{if(url){s.poster=url;img.src=url}});
 if(posterObserver)posterObserver.observe(container);
 else container.__fetchPoster();
}
function renderList(){
 const matching=shows.filter(isMatch);$('result-count').innerHTML='顯示 <strong>'+matching.length+'</strong> 部影集';syncButtons();const root=$('series-list');root.replaceChildren();
 if(!matching.length){const empty=make('div','empty');empty.appendChild(make('h3','',onlySaved&&saved.size===0?'還沒有加入待看影集':'找不到符合條件的影集'));empty.appendChild(make('p','',onlySaved&&saved.size===0?'先瀏覽全部影集，將感興趣的作品加入待看清單。':'可以減少選取的標籤，或改用「符合任一 OR」。'));const btn=make('button','', '顯示全部影集');btn.type='button';btn.addEventListener('click',()=>{selected.clear();onlySaved=false;renderChips();renderList()});empty.appendChild(btn);root.appendChild(empty);return}
 for(const s of matching){
  const row=make('article','series');row.setAttribute('aria-label',s.name+' '+s.english);
  const poster=make('div','poster');const fallback=make('div','poster-fallback',s.english);poster.appendChild(fallback);
  const img=make('img','');img.alt=s.name+'影集宣傳海報';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';poster.appendChild(img);setPoster(s,img,poster);row.appendChild(poster);
  const content=make('div','series-body');const head=make('div','series-head');
  const top=make('div','series-top');const titles=make('div','');titles.appendChild(make('h3','',s.name));titles.appendChild(make('p','english',s.english));top.appendChild(titles);
  const isSaved=saved.has(s.id);const save=make('button','save');save.type='button';save.dataset.save=s.id;save.setAttribute('aria-pressed',String(isSaved));save.setAttribute('aria-label',(isSaved?'從待看清單移除':'加入待看清單：')+s.name);save.innerHTML=bookmarkSvg+'<span>'+(isSaved?'已加入待看':'加入待看')+'</span>';
  save.addEventListener('click',()=>{if(saved.has(s.id))saved.delete(s.id);else saved.add(s.id);try{localStorage.setItem(STORAGE_KEY,JSON.stringify([...saved]))}catch(_e){}renderList()});top.appendChild(save);head.appendChild(top);
  const facts=make('div','facts');for(const v of [s.years,s.seasons,s.episodes])facts.appendChild(make('span','',v));head.appendChild(facts);
  const tags=make('div','tags');for(const t of [...s.genre,...s.theme])tags.appendChild(make('span','mini-tag',t));head.appendChild(tags);content.appendChild(head);
  content.appendChild(make('p','synopsis',s.synopsis));row.appendChild(content);root.appendChild(row)
 }
}
$('reset').addEventListener('click',()=>{selected.clear();renderChips();renderList()});document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;renderList()}));$('watch-filter').addEventListener('click',()=>{onlySaved=!onlySaved;renderList()});
$('poster-credits').innerHTML='部分海報由 <a class="source-link" href="https://www.tvmaze.com/" target="_blank" rel="noopener noreferrer">TVmaze</a> 提供；其他宣傳海報參考來源包含 TMDb、JustWatch、FilmAffinity、IMP Awards 等。';
renderChips();renderList();
</script>
